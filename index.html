<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>THE FACE</title>
<style>
/* Written to run on old handheld browsers too: no `inset`, no `?.`, no nesting,
   explicit sizes everywhere, everything in one file. */
:root{
  --bg:#0a0713; --bg2:#140b22; --ink:#ece6ff; --dim:#9d8fc4;
  --green:#3dff77; --cyan:#3ce0ff; --yellow:#ffd93d; --red:#ff5a6e; --purple:#c9a3ff;
  --panel:rgba(22,13,38,.92); --line:rgba(201,163,255,.26);
  --pix:"Courier New",Courier,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{overflow:hidden;touch-action:manipulation}

/* the paddings carry the phone's safe area so nothing hides under a camera
   cutout or a gesture bar. env() falls back to 0 where it is not understood. */
#app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;
  align-items:center;max-width:820px;margin:0 auto;
  padding:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px))
          calc(10px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px))}

/* ---------- top bar ---------- */
#bar{width:100%;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
#stage{font-family:var(--pix);font-weight:bold;font-size:13px;letter-spacing:1px;color:var(--purple)}
#best{font-size:12px;color:var(--dim)}
#bFull{display:none;flex:0 0 auto;margin-left:8px;width:30px;height:26px;padding:0;
  border:2px solid var(--line);border-radius:8px;background:rgba(18,10,32,.9);
  color:var(--purple);font-size:14px;line-height:1;cursor:pointer}
#bFull.on{display:block}
#bFull.is{border-color:var(--green);color:var(--green)}
#count{width:100%;text-align:center;font-family:var(--pix);font-weight:bold;
  font-size:clamp(30px,10vw,54px);line-height:1.1;margin:2px 0 0;color:var(--green);
  text-shadow:0 0 18px rgba(61,255,119,.35)}
#rate{width:100%;text-align:center;font-size:13px;color:var(--dim);min-height:18px}

/* ---------- progress ---------- */
#prog{width:100%;height:14px;border-radius:8px;background:rgba(255,255,255,.08);
  overflow:hidden;margin:6px 0 2px;border:1px solid var(--line)}
#progf{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--purple));
  transition:width .25s ease}
#next{width:100%;text-align:center;font-size:11.5px;color:var(--dim);min-height:16px}

/* ---------- the creature ---------- */
#stagewrap{flex:1 1 auto;width:100%;position:relative;min-height:0;display:flex;
  align-items:center;justify-content:center;margin:4px 0}
#cv{position:absolute;top:0;right:0;bottom:0;left:0;display:block;width:100%;height:100%;
  touch-action:manipulation;cursor:pointer}
#tapme{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--pix);
  font-weight:bold;font-size:13px;color:var(--yellow);pointer-events:none;
  animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

/* ---------- the level, which goes up on its own ---------- */
#level{width:100%;flex:0 0 auto;border:2px solid var(--line);border-radius:12px;
  background:var(--panel);padding:8px 10px 9px;margin-top:2px}
#lvlbar{width:100%;height:12px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
#lvlf{height:100%;width:0%;background:linear-gradient(90deg,var(--yellow),var(--green));
  transition:width .2s ease}
#lvln{text-align:center;font-size:12px;color:var(--dim);margin-top:5px;min-height:16px}
#rate{color:var(--yellow);font-family:var(--pix);font-weight:bold;letter-spacing:1px}
#rate.up{animation:lvlpop .5s ease}
@keyframes lvlpop{0%{transform:scale(1)}30%{transform:scale(1.22);color:#3dff77}100%{transform:scale(1)}}
#foot{width:100%;flex:0 0 auto;display:flex;gap:7px;margin-top:7px}
.btn{flex:1;border:2px solid var(--line);border-radius:11px;background:rgba(18,10,32,.9);
  color:var(--dim);font-family:var(--pix);font-weight:bold;font-size:11px;padding:9px 6px;cursor:pointer}
.btn:active{transform:translateY(1px)}

/* ---------- the reveal ---------- */
#reveal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:none;
  align-items:center;justify-content:center;flex-direction:column;
  background:rgba(4,2,10,.94);padding:22px;text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
#reveal.on{display:flex}
#rTitle{font-family:var(--pix);font-weight:bold;font-size:clamp(22px,8vw,46px);
  color:var(--red);line-height:1.2;text-shadow:0 0 22px rgba(255,90,110,.5)}
#rSub{font-size:clamp(14px,4vw,19px);color:var(--ink);margin-top:14px;max-width:520px;line-height:1.5}
#rGo{margin-top:24px;border:2px solid var(--green);border-radius:12px;background:transparent;
  color:var(--green);font-family:var(--pix);font-weight:bold;font-size:14px;padding:12px 22px;cursor:pointer}
.shake{animation:shk .5s ease-in-out}
@keyframes shk{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(-9px,4px)}35%{transform:translate(8px,-5px)}
  55%{transform:translate(-6px,-3px)}75%{transform:translate(5px,4px)}
}
#trust{position:fixed;top:0;right:0;bottom:0;left:0;z-index:58;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  background:rgba(4,2,10,.93);padding:22px;text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
#trust.on{display:flex}
#tsQ{font-family:var(--pix);font-weight:bold;font-size:clamp(22px,8vw,46px);color:var(--yellow);
  line-height:1.2;text-shadow:0 0 22px rgba(255,217,61,.45)}
#tsSub{font-size:clamp(13px,3.8vw,18px);color:var(--dim);margin-top:12px;max-width:460px;line-height:1.5}
#tsRow{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;justify-content:center}
#tsRow button{border-radius:12px;border:2px solid var(--line);background:transparent;
  font-family:var(--pix);font-weight:bold;font-size:13px;padding:14px 20px;cursor:pointer}
#tsYes{color:var(--green);border-color:var(--green)}
#tsNo{color:var(--cyan);border-color:var(--cyan)}
#askagain{display:none;margin:4px auto 0;border:2px solid var(--yellow);border-radius:11px;
  background:transparent;color:var(--yellow);font-family:var(--pix);font-weight:bold;
  font-size:11px;padding:7px 14px;cursor:pointer}
#askagain.on{display:block}
#picker{position:fixed;top:0;right:0;bottom:0;left:0;z-index:55;display:none;
  flex-direction:column;align-items:center;justify-content:flex-start;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:rgba(4,2,10,.96);
  padding:calc(14px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px))
          calc(16px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}
#picker.on{display:flex}
#pkHead{font-family:var(--pix);font-weight:bold;font-size:clamp(13px,4.2vw,22px);
  color:var(--purple);letter-spacing:2px;margin-bottom:10px;flex:0 0 auto;text-align:center}
#pkGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;max-width:460px;flex:0 0 auto}
.pk{border:2px solid var(--line);border-radius:14px;background:rgba(20,12,34,.9);
  padding:8px 6px 7px;text-align:center;cursor:pointer;color:var(--ink);font:inherit;display:block}
.pk.sel{border-color:var(--green);box-shadow:0 0 16px rgba(61,255,119,.25)}
.pk.lock{opacity:.5}
.pk canvas{display:block;width:100%;height:auto;border-radius:10px}
.pk .nm{font-family:var(--pix);font-weight:bold;font-size:10px;margin-top:5px;letter-spacing:.5px}
.pk .lk{font-size:10px;color:var(--yellow);margin-top:3px;min-height:13px}
.pk .becomes{font-size:9.5px;color:var(--dim);margin-top:1px;min-height:12px}
#pkClose{margin-top:14px;flex:0 0 auto;border:2px solid var(--green);border-radius:12px;background:transparent;
  color:var(--green);font-family:var(--pix);font-weight:bold;font-size:14px;padding:11px 30px;cursor:pointer}
/* sits in the middle of the screen, not down behind the buttons where the old
   one was half cut off */
#toast{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:60;
  background:rgba(12,7,22,.97);border:2px solid var(--yellow);border-radius:14px;
  padding:12px 18px;font-family:var(--pix);font-weight:bold;font-size:13px;color:var(--yellow);
  display:none;max-width:88%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#toast.on{display:block}
/* ---------- make your own face ---------- */
#maker{position:fixed;top:0;right:0;bottom:0;left:0;z-index:55;display:none;
  background:rgba(6,3,14,.98);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(8px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-right,0px))
          calc(8px + env(safe-area-inset-bottom,0px)) calc(8px + env(safe-area-inset-left,0px))}
#maker.on{display:block}
#mkHead{text-align:center;font-family:var(--pix);font-weight:bold;font-size:14px;
  letter-spacing:2px;color:var(--purple);margin:2px 0 6px}
#mkStageBox{position:relative;width:100%;height:34vh;min-height:170px;max-height:270px;border:2px dashed var(--line);
  border-radius:14px;background:rgba(255,255,255,.03);overflow:hidden}
#mkCv{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
#mkLater{position:absolute;top:6px;right:6px;width:74px;text-align:center;pointer-events:none;
  background:rgba(0,0,0,.35);border-radius:10px;padding:3px 2px}
#mkLater canvas{width:100%;height:60px;display:block}
.mkPvL{font-family:var(--pix);font-size:8.5px;letter-spacing:1px;color:var(--dim);margin-top:1px}
#mkHint{position:absolute;left:4px;right:76px;bottom:6px;text-align:center;font-size:9.5px;line-height:1.3;
  color:var(--dim);pointer-events:none}
#mkNext{font-size:11.5px;color:var(--yellow);margin:7px 0 8px;min-height:16px;text-align:center}
.mkRow{margin-bottom:9px}
.mkRow h4{margin:0 0 5px;font-family:var(--pix);font-weight:bold;font-size:11.5px;
  letter-spacing:1.5px;color:var(--cyan)}
.mkOpts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.mkOpts.five{grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:5px}
.mkOpts.five .opt{font-size:9.5px;padding:5px 2px;letter-spacing:0}
.mkOpts.five .opt canvas{height:26px}
.opt{border:2px solid var(--line);border-radius:10px;background:var(--panel);
  color:var(--ink);font:inherit;font-size:11.5px;padding:8px 4px;cursor:pointer;
  text-align:center;width:100%}
/* touch-action:none only on the two rows he drags from — putting it on every
   button stopped the panel scrolling at all, because the buttons cover it */
.opt.drag{touch-action:none}
.opt.sel{border-color:var(--green);color:var(--green);font-weight:bold}
.opt.lock{opacity:.45;cursor:default;color:var(--dim)}
.opt .sw{display:block;width:100%;height:11px;border-radius:5px;margin-bottom:4px}
.opt .need{display:block;font-family:var(--pix);font-size:10px;color:var(--yellow);margin-top:2px}
.opt canvas{display:block;width:100%;height:30px;margin-bottom:2px}
#scareCv{position:fixed;top:0;left:0;width:100%;height:100%;z-index:58;display:none;
  pointer-events:none}
#scareCv.on{display:block}
#mkGhost{position:fixed;z-index:70;pointer-events:none;display:none;
  margin-left:-26px;margin-top:-26px}
#mkGhost.on{display:block}
#mkFoot{display:flex;margin-top:6px;padding-bottom:8px}
#mkFoot .btn{margin-right:6px}
#mkFoot .btn:last-child{margin-right:0}
#iFull{display:none;margin-top:7px;padding:6px 14px;border:2px solid var(--line);
  border-radius:10px;background:rgba(10,4,30,.5);color:var(--dim);
  font-family:var(--pix);font-weight:bold;font-size:10.5px;letter-spacing:1px;cursor:pointer}
#iFull.on{display:block}
#iMake{display:none;margin-top:9px;padding:9px 18px;border:2px solid var(--purple);
  border-radius:12px;background:rgba(10,4,30,.6);color:#e9d8ff;
  font-family:var(--pix);font-weight:bold;font-size:13px;letter-spacing:1px;cursor:pointer}
#iMake.on{display:block}
/* ---------- the opening page ---------- */
#intro{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;display:none;
  overflow:hidden;background:#12043a}
#intro.on{display:block}
/* a rotating square shows its own corners unless it is far bigger than the
   screen. top/left are used rather than negative margins because a percentage
   margin-top resolves against the WIDTH, which put the spin off centre. */
#skyA,#skyB{position:absolute;top:-70%;left:-70%;width:240%;height:240%}
#skyA{background:radial-gradient(circle at 20% 20%,#4b1fb0 0%,rgba(75,31,176,0) 55%),
                radial-gradient(circle at 80% 15%,#0f7fd0 0%,rgba(15,127,208,0) 50%),
                radial-gradient(circle at 50% 92%,#c4157e 0%,rgba(196,21,126,0) 55%);
      animation:swirl 20s linear infinite}
#skyB{background:radial-gradient(circle at 70% 62%,#1fc39a 0%,rgba(31,195,154,0) 45%),
                radial-gradient(circle at 12% 72%,#ff8a1f 0%,rgba(255,138,31,0) 45%);
      opacity:.7;animation:swirl 31s linear infinite reverse}
@keyframes swirl{0%{transform:rotate(0deg) scale(1.06)}100%{transform:rotate(360deg) scale(1.06)}}
.blob{position:absolute;border-radius:50%;opacity:.34}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-30px) rotate(14deg)}}
/* a grid, so the same three pieces stack on a phone and sit side by side on a
   handheld held landscape: [head] / [picture] / [buttons] becomes
   [picture][head] / [picture][buttons] */
#introIn{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;
  grid-template-columns:1fr;grid-auto-rows:auto;align-content:center;justify-items:center;
  text-align:center;padding:8px}
#iHead,#iBody{width:100%;display:flex;flex-direction:column;align-items:center}
#iTitle{font-family:var(--pix);font-weight:bold;letter-spacing:5px;
  font-size:clamp(26px,9vw,52px);margin:0;color:#fff;line-height:1.05;
  text-shadow:0 3px 0 #8a1bd0,0 0 26px rgba(255,255,255,.45)}
#iSub{font-size:clamp(11px,3.2vw,15px);color:#ffe9a8;margin:4px 0 0;font-weight:bold;letter-spacing:1px}

/* the picture stays whole. The wrapper keeps the photo's shape (700x1244) so
   the two glows can be placed on the heads as plain percentages. */
#iPicWrap{position:relative;height:42vh;width:23.63vh;margin:10px 0 0;
  border-radius:16px;overflow:hidden;border:3px solid rgba(255,255,255,.55);
  box-shadow:0 8px 26px rgba(0,0,0,.45);flex:0 0 auto}
#iPicWrap.pop{animation:picpop .22s ease}
@keyframes picpop{0%{transform:scale(1)}45%{transform:scale(1.05) rotate(-1.2deg)}100%{transform:scale(1)}}
#iPic{position:absolute;top:0;left:0;width:100%;height:100%;display:block;
  -webkit-filter:none;filter:none}
.glow{position:absolute;border-radius:50%;opacity:0;pointer-events:none;
  box-shadow:0 0 0 3px rgba(255,255,255,0) inset}
#gD{left:40%;top:6.7%;width:62%;height:34.9%}
#gS{left:1.1%;top:23.6%;width:46%;height:25.9%}
#iTint{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;pointer-events:none;
  background:radial-gradient(circle at 50% 40%,rgba(61,255,119,.30),rgba(120,0,200,.55))}
#iStamp{position:absolute;left:0;right:0;bottom:6%;opacity:0;pointer-events:none;
  font-family:var(--pix);font-weight:bold;font-size:12px;letter-spacing:2px;color:#0b0320;
  background:rgba(61,255,119,.92);padding:5px 0}
#iAsk{font-size:clamp(11px,3.1vw,15px);color:#fff;margin:10px 0 6px;max-width:440px;line-height:1.4}

#iRow{display:flex;align-items:stretch;justify-content:center;width:100%;max-width:440px}
.who{width:46%;max-width:190px;margin:0 2%;background:rgba(10,4,30,.55);
  border:2px solid rgba(255,255,255,.4);border-radius:14px;padding:9px 8px 10px;
  color:var(--ink);cursor:pointer;display:block;-webkit-user-select:none;user-select:none}
.who.hit{animation:pop .2s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.10) rotate(-2deg)}100%{transform:scale(1)}}
.who.full{border-color:#3dff77;box-shadow:0 0 20px rgba(61,255,119,.45)}
.wn{display:block;font-family:var(--pix);font-weight:bold;font-size:13px;letter-spacing:2px;color:#fff}
.wc{display:block;font-family:var(--pix);font-weight:bold;font-size:19px;color:#ffd93d;margin-top:2px}
.who.full .wc{color:#3dff77}
.wb{display:block;height:9px;border-radius:6px;background:rgba(255,255,255,.22);
  overflow:hidden;margin-top:6px}
.wbf{display:block;height:100%;width:0%;
  background:linear-gradient(90deg,#3ce0ff,#3dff77);transition:width .18s ease}
#iGo{display:none;margin-top:12px;padding:12px 30px;border:0;border-radius:14px;
  font-family:var(--pix);font-weight:bold;font-size:21px;letter-spacing:4px;color:#12043a;
  background:linear-gradient(180deg,#ffe066,#ffb03d);box-shadow:0 6px 0 #a35b00;cursor:pointer}
#iGo.on{display:block;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media (max-height:560px){
  #iTitle{font-size:clamp(20px,6vw,34px);letter-spacing:3px}
  #iSub{font-size:12px}
  #iAsk{margin:6px 0 4px}
  .who{padding:5px 6px 7px}
  .wc{font-size:16px}
  #iGo{margin-top:8px;padding:9px 24px;font-size:18px}
}
/* handheld, held sideways: the picture goes down the left at full height */
@media (max-height:560px) and (orientation:landscape){
  #introIn{grid-template-columns:auto minmax(0,1fr);align-items:center;padding:6px 10px}
  #iPicWrap{grid-column:1;grid-row:1 / span 2;height:90vh;width:50.6vh;margin:0 14px 0 0}
  #iHead{grid-column:2;grid-row:1}
  #iBody{grid-column:2;grid-row:2}
  #iSub{display:none}
  #iRow{max-width:100%}
}
@media (max-height:520px){
  #count{font-size:clamp(22px,7vw,36px)}
  #level{padding:5px 8px 6px}
  #lvln{font-size:11px;margin-top:3px}
}
@media (min-width:620px){
  #pkGrid{grid-template-columns:repeat(5,1fr);max-width:760px}
  .pk .becomes{font-size:9px}
}
/* a handheld held sideways, or any short screen: more across, less down */
@media (max-height:600px){
  #pkGrid{grid-template-columns:repeat(5,1fr);gap:7px;max-width:720px}
  .pk{padding:5px 4px 5px}
  .pk .nm{font-size:9px;margin-top:3px}
  .pk .lk{font-size:8.5px;min-height:11px}
  .pk .becomes{display:none}
  #pkHead{margin-bottom:7px}
  #pkClose{margin-top:9px;padding:8px 22px}
}
/* the face maker, sideways: head down the left, the parts down the right */
@media (max-height:760px) and (orientation:landscape){
  #mkHead{font-size:12px;margin:0 0 4px}
  #mkStageBox{position:fixed;left:8px;top:30px;width:44%;height:auto;
    bottom:62px;min-height:0;max-height:none}
  /* the "what opens next" line goes above the parts on the right, where there
     is room for it, instead of under the head where the buttons sat on it */
  #mkNext{position:static;margin:0 0 5px 46%;text-align:left;font-size:10px}
  #mkFoot{position:fixed;left:8px;bottom:8px;width:44%;margin:0}
  #mkRows{margin-left:46%}
  .mkRow{margin-bottom:6px}
  .mkRow h4{font-size:10px;margin-bottom:3px}
  .mkOpts{grid-template-columns:repeat(4,1fr);gap:5px}
  .mkOpts.five{grid-template-columns:repeat(5,1fr);gap:4px}
  .opt{font-size:9.5px;padding:5px 2px}
  .opt canvas{height:22px}
  .opt .sw{height:8px}
}
</style>
</head>
<body>
<div id="intro" class="on">
  <div id="skyA"></div>
  <div id="skyB"></div>
  <div id="blobs"></div>
  <div id="introIn">
    <div id="iHead">
      <div id="iTitle">THE FACE</div>
      <div id="iSub">&#127918; A GAME FOR SEBASTIAN</div>

/* LEVELS — no shop, nothing to buy. Every so many taps it levels up on its own

   they are set so that reaching the last stage takes roughly a thousand real

var LEVELS=[

];


/* =======================================================================
   THE FACES — each one turns into a different thing at the end
   ======================================================================= */
/* =======================================================================
   MAKE YOUR OWN FACE
   Each part has options that open up as he plays. The number is his lifetime
   score across every face, so building the good one is the reward for the
   whole game rather than for one face.
   ======================================================================= */
var TIERS=[0,250,1200,4000,12000,30000,60000];

function hx(n){ n=Math.max(0,Math.min(255,Math.round(n))); var t=n.toString(16); return t.length<2?'0'+t:t; }
function hsl2hex(h,s,l){
  h=((h%360)+360)%360; s=Math.max(0,Math.min(1,s)); l=Math.max(0,Math.min(1,l));
  var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2, r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return '#'+hx((r+m)*255)+hx((g+m)*255)+hx((b+m)*255);
}
/* seven steps from bright and friendly down to dark and wrong */
function mkPal(h,s,l,drift){
  var col=[],sha=[],i;

/* =======================================================================
   THE FINAL BOSS — the music
   Written here in code rather than loaded as a file: it is an original piece,
   it adds nothing to the download, it loops for ever without a seam, and it
   works with no internet. It is in D minor at 150, and it grows as the face
   does — the drums and the lead only arrive once the thing has gone wrong.
   ======================================================================= */
var BPM=145, STEP=60/BPM/4;              /* one sixteenth */
var BARS=8, STEPS=BARS*16;               /* eight bars, then it drops again */

/* E minor, one chord a bar: Em - C - G - D, twice round */
var ROOTS=[40,36,43,38, 40,36,43,38];
/* the tune, written out as real notes rather than intervals, so it is a tune
   and not the same shape slid up and down. -1 is a rest. */
var LEAD=[
 71,-1,71,-1, 76,-1,74,-1, 71,-1,-1,69, 71,-1,-1,-1,
 72,-1,72,-1, 76,-1,74,-1, 72,-1,-1,71, 72,-1,-1,-1,
 74,-1,74,-1, 79,-1,78,-1, 74,-1,-1,71, 74,-1,-1,-1,
 69,-1,69,-1, 74,-1,73,-1, 69,-1,-1,66, 69,-1,-1,-1,
 76,-1,-1,74, 76,-1,79,-1, 78,-1,76,-1, 74,-1,71,-1,
 72,-1,-1,74, 76,-1,79,-1, 81,-1,79,-1, 76,-1,74,-1,
 74,-1,-1,76, 79,-1,83,-1, 81,-1,79,-1, 78,-1,74,-1,
 81,-1,79,-1, 78,-1,76,-1, 74,-1,73,-1, 74,-1,-1,-1];

function isKick(i){ return (i%4)===0; }                 /* four on the floor */
function isClap(i){ return (i%16)===4||(i%16)===12; }
function isBass(i){ return (i%4)===2||(i%16)===0; }      /* off the beat, the dance way */
function isOpenHat(i){ return (i%4)===2; }
function isStab(i){ return (i%8)===2||(i%8)===6; }
/* the last bar is the build: a snare roll that speeds up into the drop */
function isRoll(i){
  if(i<STEPS-8) return false;
  var k=i-(STEPS-8);
  return k===0||k===2||k===4||k===5||k===6||k===7;
}

var MUSIC={on:false,mode:'made',step:0,next:0,timer:null,bus:null,duck:null,noise:null,intensity:0};

function mfreq(n){ return 440*Math.pow(2,(n-69)/12); }
function musicBus(){
  var c=actx(); if(!c) return null;
  if(!MUSIC.bus){
    MUSIC.bus=c.createGain();
    MUSIC.bus.gain.value=0.0001;
    MUSIC.bus.connect(c.destination);
    /* everything except the kick goes through here, and the kick ducks it.
       That pump on every beat is the sound he is asking for. */
    MUSIC.duck=c.createGain();
    MUSIC.duck.gain.value=1;
    MUSIC.duck.connect(MUSIC.bus);
  }
  return MUSIC.bus;
}
function noiseBuf(){
  var c=actx(); if(!c) return null;
  if(!MUSIC.noise){
    var n=Math.floor(c.sampleRate*0.9);
    var b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0), i;
    for(i=0;i<n;i++) d[i]=Math.random()*2-1;
    MUSIC.noise=b;

}
function mVoice(t,freq,dur,type,vol,filt,slideTo,dry){
  var c=actx(); if(!musicBus()) return;
  var dest=dry?MUSIC.bus:MUSIC.duck;

  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  if(filt){
    var f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filt;
    g.connect(f); f.connect(dest);
  }else{ g.connect(dest); }
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);
  o.start(t); o.stop(t+dur+0.02);

/* three saws slightly out of tune with each other: the big bright lead */
function mSuper(t,freq,dur,vol,filt,voices){
  var i,n=voices||3, det=[0,-9,9,-16,16];
  for(i=0;i<n;i++) mVoice(t,freq*Math.pow(2,det[i]/1200),dur,'sawtooth',vol/Math.sqrt(n),filt);

function mNoise(t,dur,vol,hp,dry,sweepTo){
  var c=actx(), b=noiseBuf(); if(!musicBus()||!b) return;
  var s=c.createBufferSource(), g=c.createGain(), f=c.createBiquadFilter();
  s.buffer=b; f.type='highpass'; f.frequency.setValueAtTime(hp,t);
  if(sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo,t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(dry?MUSIC.bus:MUSIC.duck);
  s.start(t); s.stop(t+dur+0.02);

function mKick(t,lvl){
  var c=actx(); if(!musicBus()) return;
  mVoice(t,150,0.19,'sine',0.42,0,42,true);
  mNoise(t,0.02,0.09,2500,true);
  /* the pump: pull everything else down, then let it swell back */
  var d=MUSIC.duck.gain;
  var deep=(lvl>=5)?0.26:0.38;
  d.cancelScheduledValues(t);
  d.setValueAtTime(deep,t);
  d.linearRampToValueAtTime(1,t+Math.min(0.30,STEP*3.2));

/* if the gadget is struggling, thin the big saw chords out rather than let
   the drawing stutter. The Anbernic is the one this is for. */
var FPS={last:0,frames:0,at:0,slow:false};
function fpsWatch(now){
  FPS.frames++;
  if(!FPS.at){ FPS.at=now; return; }
  if(now-FPS.at>=1000){
    var fps=FPS.frames*1000/(now-FPS.at);
    FPS.slow=(fps<38);
    FPS.frames=0; FPS.at=now;
  }
}
function leadVoices(lvl){
  if(FPS.slow) return lvl>=6?2:1;
  return lvl>=6?5:3;
}
function musicStep(i,t){
  var lvl=MUSIC.intensity;
  var bar=Math.floor(i/16);
  var root=ROOTS[bar%ROOTS.length];

  if(isKick(i)) mKick(t,lvl);
  if(isBass(i)){
    mVoice(t,mfreq(root-12),STEP*1.6,'sawtooth',0.30,420);
    mVoice(t,mfreq(root-24),STEP*1.6,'sine',0.22,260);
  }
  if(lvl>=1&&(i%2===1)) mNoise(t,0.026,0.040,8000);
  if(lvl>=2&&isClap(i)){

  if(lvl>=3&&isOpenHat(i)) mNoise(t,0.085,0.055,6000);
  if(lvl>=3&&isStab(i)){
    var sv=FPS.slow?1:2;
    mSuper(t,mfreq(root+12),0.10,0.055,2600,sv);
    mSuper(t,mfreq(root+15),0.10,0.050,2600,sv);
    mSuper(t,mfreq(root+19),0.10,0.046,2600,sv);

  if(lvl>=4&&LEAD[i]>=0){
    var dur=STEP*1.8;
    if(lvl>=5) mSuper(t,mfreq(LEAD[i]),dur,0.115,3800,leadVoices(lvl));
    else       mVoice(t,mfreq(LEAD[i]),dur,'sawtooth',0.085,2600);
      if(lvl>=6&&!FPS.slow) mSuper(t,mfreq(LEAD[i]+12),dur*0.8,0.050,5200,2);
  }
  /* the build at the end of the eight bars, into the drop */
  if(lvl>=6){
    if(isRoll(i)) mNoise(t,0.07,0.13,1500);
    if(i===STEPS-16) mNoise(t,STEP*15,0.055,300,false,6000);   /* the riser */
    if(i===0) mNoise(t,0.7,0.10,900,true);                     /* the crash */
  }
}
function musicTick(){
  var c=actx(); if(!c) return;
  if(c.state==='suspended'&&c.resume) c.resume();
  var horizon=c.currentTime+0.30;
  if(MUSIC.next<c.currentTime) MUSIC.next=c.currentTime+0.06;
  while(MUSIC.next<horizon){
    musicStep(MUSIC.step,MUSIC.next);
    MUSIC.next+=STEP;
    MUSIC.step=(MUSIC.step+1)%STEPS;
  }
}
/* ---------- a real track, if one is sitting next to the game ----------
   Put a file called boss.mp3 in the same folder as index.html and the game
   plays that instead of the one it generates. Nothing to change in here. */
var TRACK={el:null,state:'unknown'};
function trackEl(){
  if(!TRACK.el){
    var a=document.createElement('audio');
    a.loop=true; a.preload='auto'; a.volume=0;
    a.addEventListener('canplaythrough',function(){ TRACK.state='yes'; },false);
    a.addEventListener('error',function(){ TRACK.state='no'; },false);
    a.src='boss.mp3';
    TRACK.el=a;
  }
  return TRACK.el;
}
function trackPlay(){
  var a=trackEl();
  a.volume=0.62;
  var p=a.play();
  if(p&&p['catch']) p['catch'](function(){});
  MUSIC.mode='file';
}
function trackStop(){
  if(TRACK.el){ try{ TRACK.el.pause(); }catch(e){} }
}

function musicLevel(){
  /* on the opening page it simmers; in the game it follows the face */
  if($('#intro')&&$('#intro').className==='on') return 3;
  return Math.max(0,Math.min(6,S.stage));
}
function musicStart(){
  if(MUSIC.on||!S.music) return;
  trackEl();                              /* start finding out about boss.mp3 */
  if(TRACK.state==='yes'){ MUSIC.on=true; trackPlay(); return; }
  var c=actx(), bus=musicBus(); if(!c||!bus) return;
  MUSIC.mode='made';
  MUSIC.on=true; MUSIC.step=0; MUSIC.next=c.currentTime+0.08;
  MUSIC.intensity=musicLevel();
  bus.gain.cancelScheduledValues(c.currentTime);
  bus.gain.setValueAtTime(0.0001,c.currentTime);
  bus.gain.exponentialRampToValueAtTime(0.55,c.currentTime+1.0);
  MUSIC.duck.gain.cancelScheduledValues(c.currentTime);
  MUSIC.duck.gain.setValueAtTime(1,c.currentTime);
  MUSIC.timer=setInterval(function(){
    /* if the file turns up a moment late, hand over to it */
    if(TRACK.state==='yes'){ musicStop(); MUSIC.on=true; trackPlay(); return; }
    MUSIC.intensity=musicLevel();
    musicTick();
  },70);
}
function musicStop(){
  if(!MUSIC.on) return;
  MUSIC.on=false;
  trackStop();
  if(MUSIC.timer){ clearInterval(MUSIC.timer); MUSIC.timer=null; }
  var c=actx(), bus=MUSIC.bus;
  if(c&&bus){
    bus.gain.cancelScheduledValues(c.currentTime);
    bus.gain.setValueAtTime(Math.max(0.0001,bus.gain.value),c.currentTime);
    bus.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.35);
  }
}

   ======================================================================= */
var cv=$('#cv'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
var lastW=0,lastH=0;
function sizeCanvas(){
  var r=cv.parentNode.getBoundingClientRect();
  if(Math.abs(r.width-lastW)<1&&Math.abs(r.height-lastH)<1) return;
  lastW=r.width; lastH=r.height;
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(120,Math.floor(r.width)); H=Math.max(120,Math.floor(r.height));
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

   on the button — never on its own. Whether he wants it is remembered.
   ======================================================================= */

  return document.fullscreenElement||document.webkitFullscreenElement||
         document.mozFullScreenElement||document.msFullscreenElement||null;

            e.mozRequestFullScreen||e.msRequestFullscreen);

    else if(e.webkitRequestFullscreen) e.webkitRequestFullscreen();
    else if(e.mozRequestFullScreen) e.mozRequestFullScreen();
    else if(e.msRequestFullscreen) e.msRequestFullscreen();
  }catch(err){}
}

    if(document.exitFullscreen){ var p=document.exitFullscreen(); if(p&&p['catch']) p['catch'](function(){}); }
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if(document.mozCancelFullScreen) document.mozCancelFullScreen();

/* ---------- the screams ----------
   Every one of them is built the same way and set up differently: an
   oscillator whose pitch swoops, bent through a distortion curve, with a
   wobble on top and a layer of noise for the breath. Change the numbers and
   you get a shriek, a gurgle, a roar or a screech. */
var DISTC={};
function distCurve(amount){
  if(DISTC[amount]) return DISTC[amount];
  var n=1024, curve=new Float32Array(n), i, k=amount;
  for(i=0;i<n;i++){
    var x=i*2/n-1;
    curve[i]=(1+k)*x/(1+k*Math.abs(x));
  }
  DISTC[amount]=curve;
  return curve;
}
function scream(o){
  if(!S.sound) return;
  var c=actx(); if(!c) return;
  try{
    var t=c.currentTime, d=o.dur||1.1, vol=(o.vol||0.30);

    /* the voice */
    var osc=c.createOscillator(), g=c.createGain(), out=c.createGain();
    osc.type=o.type||'sawtooth';
    osc.frequency.setValueAtTime(o.f0,t);
    osc.frequency.exponentialRampToValueAtTime(o.f1,t+d*0.28);
    osc.frequency.exponentialRampToValueAtTime(o.f2,t+d);

    var node=osc;
    if(o.dist){
      var ws=c.createWaveShaper();
      ws.curve=distCurve(o.dist); ws.oversample='2x';
      osc.connect(ws); node=ws;
    }
    var lp=c.createBiquadFilter();
    lp.type='bandpass';
    lp.frequency.setValueAtTime(o.bp0||1200,t);
    lp.frequency.exponentialRampToValueAtTime(o.bp1||2400,t+d);
    lp.Q.value=o.q||1.1;
    node.connect(lp); lp.connect(g);

    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.035);
    g.gain.setValueAtTime(vol,t+d*0.55);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    g.connect(out); out.gain.value=1; out.connect(c.destination);

    /* the wobble in the voice */
    if(o.vib){
      var lfo=c.createOscillator(), la=c.createGain();
      lfo.type='sine'; lfo.frequency.value=o.vibHz||6;
      la.gain.value=o.vib;
      lfo.connect(la); la.connect(osc.frequency);
      lfo.start(t); lfo.stop(t+d+0.05);
    }
    /* the wet burble, for the ones that are not dry */
    if(o.gargle){
      var gl=c.createOscillator(), ga=c.createGain();
      gl.type='sine'; gl.frequency.value=o.gargle;
      ga.gain.value=0.55;
      gl.connect(ga); ga.connect(out.gain);
      gl.start(t); gl.stop(t+d+0.05);
    }
    osc.start(t); osc.stop(t+d+0.05);

    /* the breath behind it */
    if(o.nvol){
      var b=noiseBuf();
      if(b){
        var ns=c.createBufferSource(), nf=c.createBiquadFilter(), ng=c.createGain();
        ns.buffer=b; ns.loop=true;
        nf.type='bandpass'; nf.Q.value=o.nq||1.4;
        nf.frequency.setValueAtTime(o.nf0||900,t);
        nf.frequency.exponentialRampToValueAtTime(o.nf1||2600,t+d);
        ng.gain.setValueAtTime(0.0001,t);
        ng.gain.exponentialRampToValueAtTime(o.nvol,t+0.05);
        ng.gain.exponentialRampToValueAtTime(0.0001,t+d);
        ns.connect(nf); nf.connect(ng); ng.connect(c.destination);
        ns.start(t); ns.stop(t+d+0.05);
      }
    }
  }catch(e){}
}

/* ---------- the broken glass ---------- */
function makeCrack(x,y,len){
  var pts=[[x,y]], a=Math.random()*6.283, n=4+Math.floor(Math.random()*4), i, px=x, py=y;
  for(i=0;i<n;i++){
    a+=(Math.random()-0.5)*1.0;
    var l=(len/n)*(0.55+Math.random()*0.9);
    px+=Math.cos(a)*l; py+=Math.sin(a)*l;
    pts.push([px,py]);
  }
  return pts;
}
function crackBurst(x,y,n,len){
  var i,j;
  for(i=0;i<n;i++){
    var main=makeCrack(x,y,len);
    SCARE.cracks.push(main);
    if(Math.random()<0.7){
      j=1+Math.floor(Math.random()*(main.length-2));
      SCARE.cracks.push(makeCrack(main[j][0],main[j][1],len*0.45));
    }
  }
  if(SCARE.cracks.length>90) SCARE.cracks.splice(0,SCARE.cracks.length-90);
}
function addScareBits(x,y,kind,n){
  var i;
  for(i=0;i<n;i++){
    var a=Math.random()*6.283, sp=1+Math.random()*5;
    SCARE.bits.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,
                     life:1,k:kind,r:2+Math.random()*4});
  }
}

function addBurst(x,y,col,n){

}

function headPath(c,cx,cy,R,shape,t){
  c.beginPath();
  if(shape==='square'){
    var r2=R*0.26, x0=cx-R*0.93, y0=cy-R*0.93, w0=R*1.86, h0=R*1.86;
    if(c.roundRect){ c.roundRect(x0,y0,w0,h0,r2); }
    else{
      c.moveTo(x0+r2,y0); c.lineTo(x0+w0-r2,y0); c.quadraticCurveTo(x0+w0,y0,x0+w0,y0+r2);
      c.lineTo(x0+w0,y0+h0-r2); c.quadraticCurveTo(x0+w0,y0+h0,x0+w0-r2,y0+h0);
      c.lineTo(x0+r2,y0+h0); c.quadraticCurveTo(x0,y0+h0,x0,y0+h0-r2);
      c.lineTo(x0,y0+r2); c.quadraticCurveTo(x0,y0,x0+r2,y0); c.closePath();
    }
  }else if(shape==='blob'){
    var i2,n2=46;
    for(i2=0;i2<=n2;i2++){
      var a2=(i2/n2)*6.283;
      var rr=R*(1+0.055*Math.sin(a2*3+t*0.0016)+0.035*Math.sin(a2*5-t*0.0011));
      var px=cx+Math.cos(a2)*rr, py=cy+Math.sin(a2)*rr;
      if(i2===0) c.moveTo(px,py); else c.lineTo(px,py);
    }
    c.closePath();
  }else if(shape==='ghost'){
    c.moveTo(cx-R,cy+R*0.42);
    c.arc(cx,cy-R*0.04,R,Math.PI,0);
    c.lineTo(cx+R,cy+R*0.42);
    var k2,bumps=4;
    for(k2=0;k2<bumps;k2++){
      var bx=cx+R-(2*R/bumps)*k2, ex2=bx-(2*R/bumps);
      var dir=(k2%2===0)?1:-1;
      c.quadraticCurveTo((bx+ex2)/2, cy+R*0.42+dir*R*0.30, ex2, cy+R*0.42);
    }
    c.closePath();
  }else if(shape==='alien'){
    c.moveTo(cx,cy-R*1.02);
    c.bezierCurveTo(cx+R*1.22,cy-R*0.86, cx+R*0.96,cy+R*0.34, cx,cy+R*1.10);
    c.bezierCurveTo(cx-R*0.96,cy+R*0.34, cx-R*1.22,cy-R*0.86, cx,cy-R*1.02);
    c.closePath();
  }else{
    c.arc(cx,cy,R,0,6.283);
  }
}
function drawLegs(c,cx,cy,R,face,st,t){
  var i,legs=8;
  c.strokeStyle=face.sha[st]; c.lineCap='round';
  c.lineWidth=Math.max(2,R*(0.075+st*0.012));
  for(i=0;i<legs;i++){
    var side=(i<legs/2)?-1:1, k=(i%(legs/2));
    var a0=(-0.62+k*0.42)*side+(side<0?Math.PI:0);
    var sway=Math.sin(t*0.005+i)*0.08;
    var l1=R*1.02, l2=R*1.18;
    var x1=cx+Math.cos(a0+sway)*l1, y1=cy+Math.sin(a0+sway)*l1*0.60-R*0.26;
    var x2=x1+Math.cos(a0+sway*1.4+(st>=5?0.5*side:0.15))*l2;
    var y2=y1+Math.abs(Math.sin(a0))*l2*0.78+R*0.26;
    c.beginPath(); c.moveTo(cx,cy); c.quadraticCurveTo(x1,y1,x2,y2); c.stroke();
  }
}
function drawHood(c,cx,cy,R,face,st){
  c.fillStyle=face.sha[st];
  c.beginPath(); c.arc(cx,cy-R*0.06,R*1.16,Math.PI,0); c.closePath(); c.fill();
  c.beginPath();
  c.moveTo(cx-R*1.16,cy-R*0.06);
  c.quadraticCurveTo(cx-R*1.02,cy+R*0.92,cx-R*0.50,cy+R*1.12);
  c.lineTo(cx-R*0.50,cy+R*0.30); c.closePath(); c.fill();
  c.beginPath();
  c.moveTo(cx+R*1.16,cy-R*0.06);
  c.quadraticCurveTo(cx+R*1.02,cy+R*0.92,cx+R*0.50,cy+R*1.12);
  c.lineTo(cx+R*0.50,cy+R*0.30); c.closePath(); c.fill();
  c.fillStyle='rgba(0,0,0,'+(0.22+0.06*st)+')';
  c.beginPath(); c.arc(cx,cy-R*0.10,R*0.98,Math.PI*1.05,Math.PI*1.95); c.fill();
}

/* eyes — every eye written out in full, [x, y, radius] as a share of R.
   No mirroring shortcuts: the old version mirrored a row around the centre,
   so a row at x=-0.02 drew its pair 0.04 apart and they sat on top of each
   other. Stages 5 and 6 are laid out by hand so all six are clear of each
   other, clear of the eyebrows, and clear of the mouth. */
var EYESETS=[
  [[-0.40,-0.20,0.190],[0.40,-0.20,0.190]],
  [[-0.42,-0.22,0.200],[0.42,-0.22,0.200]],
  [[-0.42,-0.22,0.200],[0.42,-0.22,0.200]],
  [[-0.44,-0.24,0.210],[0.44,-0.24,0.210]],
  [[-0.46,-0.26,0.230],[0.46,-0.26,0.193]],
  [[-0.40,-0.22,0.175],[0.40,-0.22,0.150],
   [-0.72,-0.16,0.105],[0.72,-0.16,0.105],
   [-0.165,-0.62,0.105],[0.165,-0.62,0.095]],
  [[-0.42,-0.24,0.175],[0.42,-0.24,0.150],
   [-0.74,-0.18,0.110],[0.74,-0.18,0.110],
   [-0.170,-0.64,0.110],[0.170,-0.64,0.098]]
];

function paintFace(c,cx,cy,R,face,st,t,track){
  var col=face.col[st], sha=face.sha[st];

  if(face.shape==='spider') drawLegs(c,cx,cy,R,face,st,t);
  /* a shadow copy underneath, so it reads as a solid thing */
  c.fillStyle=sha;
  c.save(); c.translate(0,R*0.045); headPath(c,cx,cy,R,face.shape,t); c.fill(); c.restore();
  c.fillStyle=col; headPath(c,cx,cy,R,face.shape,t); c.fill();
  if(face.shape==='hood') drawHood(c,cx,cy,R,face,st);

  /* it cracks as it goes wrong */
  if(st>=3){
    c.strokeStyle='rgba(0,0,0,'+(0.16+0.09*(st-3))+')';
    c.lineWidth=Math.max(1,R*0.022); c.lineCap='round';
    var cracks=[[-0.62,-0.50,-0.34,-0.10,-0.48,0.22],[0.58,-0.36,0.38,-0.02,0.66,0.26],
                [-0.10,-0.86,0.04,-0.58,-0.16,-0.36]];
    var ci;
    for(ci=0;ci<Math.min(cracks.length,st-2);ci++){
      var cr=cracks[ci];
      c.beginPath(); c.moveTo(cx+cr[0]*R,cy+cr[1]*R);
      c.lineTo(cx+cr[2]*R,cy+cr[3]*R); c.lineTo(cx+cr[4]*R,cy+cr[5]*R); c.stroke();
    }
  }
  if(st>=4&&face.shape!=='ghost'){
    c.strokeStyle='rgba(0,0,0,.42)'; c.lineWidth=Math.max(1,R*0.018);
    var sx0=cx-R*0.74, sy0=cy-R*0.06, si;
    c.beginPath(); c.moveTo(sx0,sy0); c.lineTo(sx0+R*0.30,sy0+R*0.16); c.stroke();
    for(si=0;si<4;si++){
      var ff=si/3, px2=sx0+R*0.30*ff, py2=sy0+R*0.16*ff;
      c.beginPath(); c.moveTo(px2-R*0.035,py2-R*0.055); c.lineTo(px2+R*0.035,py2+R*0.055); c.stroke();
    }
  }

  /* eyes: the layout table lives outside this function (EYESETS) */
  var tx=track?track.x:0, ty=track?track.y:0;
  function eye(ex,ey,er,droop,kind){
    var ek=kind||face.eye;
    if(st>=6){
      var eg=c.createRadialGradient(ex,ey,er*0.2,ex,ey,er*2.4);
      eg.addColorStop(0,'rgba(255,70,70,.55)'); eg.addColorStop(1,'rgba(255,70,70,0)');
      c.fillStyle=eg; c.beginPath(); c.arc(ex,ey,er*2.4,0,6.283); c.fill();
    }
    if(ek==='hollow'){
      c.fillStyle=(st>=4)?'#0a0a14':'#2a2e4a';
      c.beginPath(); c.ellipse(ex,ey,er*0.92,er*(droop?1.12:1.02),0,0,6.283); c.fill();
      if(st>=5){
        c.fillStyle='#ff5a6e';
        c.beginPath(); c.arc(ex+tx*er*0.34,ey+ty*er*0.34,er*0.30,0,6.283); c.fill();
      }
      return;
    }
    if(ek==='square'){
      c.fillStyle=(st>=5)?'#ffe9e9':'#eef6ff';
      c.fillRect(ex-er,ey-er*0.80,er*2,er*1.60);
      c.fillStyle=(st>=4)?'#ff3b30':'#16202b';
      c.fillRect(ex-er*0.34+tx*er*0.30,ey-er*0.40+ty*er*0.30,er*0.68,er*0.80);
      if(st>=4){
        c.fillStyle='rgba(0,0,0,.30)';
        var q; for(q=0;q<3;q++) c.fillRect(ex-er,ey-er*0.8+q*er*0.55,er*2,er*0.09);
      }
      return;
    }
    if(ek==='almond'){
      c.fillStyle=(st>=4)?'#1a0b16':'#12100f';
      c.save(); c.translate(ex,ey); c.rotate((ex<cx?1:-1)*0.42);
      c.beginPath(); c.ellipse(0,0,er*1.45,er*0.78,0,0,6.283); c.fill();
      if(st>=3){
        c.fillStyle=(st>=5)?'#ff3b30':'#9bff5a';
        c.beginPath(); c.ellipse(tx*er*0.30,ty*er*0.20,er*0.34,er*0.26,0,0,6.283); c.fill();
      }
      c.restore(); return;
    }
    c.fillStyle=(st>=5)?'#ffe9e9':'#ffffff';
    c.beginPath(); c.ellipse(ex,ey,er,er*(droop?0.78:1),0,0,6.283); c.fill();
    c.strokeStyle='rgba(0,0,0,.30)'; c.lineWidth=Math.max(1,R*0.012); c.stroke();
    var pr=er*(st>=5?0.44:0.50);
    c.fillStyle=(st>=4)?'#c1121f':face.ink;
    c.beginPath(); c.arc(ex+tx*er*0.34,ey+ty*er*0.34,pr,0,6.283); c.fill();
    if(st<=2){
      c.fillStyle='rgba(255,255,255,.9)';
      c.beginPath(); c.arc(ex-pr*0.42+tx*er*0.34,ey-pr*0.46+ty*er*0.34,pr*0.34,0,6.283); c.fill();
    }
  }
  if(face.layout&&face.layout.eyes&&face.layout.eyes.length){
    /* the eyes he dragged on himself, wherever he put them */
    var hl=face.layout.eyes, hi;
    for(hi=0;hi<hl.length;hi++){
      eye(cx+hl[hi].x*R, cy+hl[hi].y*R, hl[hi].r*R, st>=4, hl[hi].k);
    }
  }else if(face.eye==='many'){
    /* two eyes belong side by side like anybody else's. Only once there are
       four or more does it split into two rows — otherwise a pair ends up
       stacked one on top of the other in the middle of the face. */
    var ne=[2,4,4,6,6,8,8][st], q2, er3=R*(0.155-0.008*st);
    var twoRows=(ne>=4), per=twoRows?Math.ceil(ne/2):ne;
    for(q2=0;q2<ne;q2++){
      var rowi=(q2<per)?0:1, idx=(q2<per)?q2:(q2-per), cnt=(rowi===0)?per:(ne-per);
      var spread=(cnt>1)?((idx/(cnt-1))-0.5):0;
      var ey2=twoRows?(cy-R*(0.34-rowi*0.26)):(cy-R*0.20);
      eye(cx+spread*R*(rowi===0?1.06:0.70), ey2, er3*(rowi===0?1:0.82), false);
    }
  }else{
    var rows=EYESETS[st],ri;
    for(ri=0;ri<rows.length;ri++){
      var row=rows[ri];
      eye(cx+row[0]*R, cy+row[1]*R, row[2]*R, st>=4);
    }
  }
  if(st>=4){
    c.strokeStyle='rgba(0,0,0,.55)'; c.lineWidth=Math.max(2,R*0.055); c.lineCap='round';
    c.beginPath(); c.moveTo(cx-R*0.64,cy-R*0.52); c.lineTo(cx-R*0.22,cy-R*0.34); c.stroke();
    c.beginPath(); c.moveTo(cx+R*0.64,cy-R*0.52); c.lineTo(cx+R*0.22,cy-R*0.34); c.stroke();
  }

  /* mouth — where he dragged it, if he dragged one */
  var lm=(face.layout&&face.layout.mouth)?face.layout.mouth:null;
  var mx=cx+(lm?lm.x*R:0);
  var my=cy+R*(lm?lm.y:0.26);
  var mscale=lm?lm.w:1;
  var mteeth=(lm&&lm.k)?lm.k:face.teeth;
  if(st<=1){
    c.strokeStyle=face.ink; c.lineWidth=Math.max(2,R*0.075); c.lineCap='round';
    var wide=(st===0)?0.42:0.56;
    c.beginPath(); c.arc(mx,my-R*0.12,R*wide*mscale,0.30,Math.PI-0.30); c.stroke();
  }else{
    var mw=R*(0.48+0.065*(st-2))*mscale, mh=R*(0.19+0.085*(st-2))*mscale;
    c.save(); headPath(c,cx,cy,R*0.985,face.shape,t); c.clip();
    c.fillStyle='#2a0a0a';
    c.beginPath();
    c.moveTo(mx-mw,my-mh*0.30);
    c.quadraticCurveTo(mx,my+mh*1.25,mx+mw,my-mh*0.30);
    c.quadraticCurveTo(mx,my-mh*0.72,mx-mw,my-mh*0.30);
    c.closePath(); c.fill();
    var nT=[0,0,2,4,6,9,11][st], ti;
    c.fillStyle=(st>=5)?'#fff4f4':'#ffffff';
    for(ti=0;ti<nT;ti++){
      var f3=(ti+0.5)/nT, txx=mx-mw+2*mw*f3, edge=Math.sin(Math.PI*f3);
      var topY=my-mh*0.30+(mh*(-0.42))*edge;
      var tw=(2*mw/nT)*(mteeth==='needle'?0.26:(mteeth==='block'?0.38:0.46));
      var th=mh*(0.34+0.14*(st-2))*edge+R*0.02;
      if(mteeth==='needle') th*=1.45;
      if(mteeth==='block'){
        c.fillRect(txx-tw,topY,tw*2,th);
      }else{
        c.beginPath(); c.moveTo(txx-tw,topY); c.lineTo(txx+tw,topY); c.lineTo(txx,topY+th);
        c.closePath(); c.fill();
      }
      if(st>=4){
        var bY=my-mh*0.30+mh*1.02*edge;
        if(mteeth==='block'){ c.fillRect(txx-tw*0.8,bY-th*0.8,tw*1.6,th*0.8); }
        else{
          c.beginPath(); c.moveTo(txx-tw*0.8,bY); c.lineTo(txx+tw*0.8,bY); c.lineTo(txx,bY-th*0.8);
          c.closePath(); c.fill();
        }
      }
    }
    c.restore();
    if(st>=5){
      c.fillStyle=face.drip; var di;
      for(di=0;di<3;di++){
        var dx2=mx+(di-1)*mw*0.62;
        var len=R*(0.10+0.07*((Math.sin(t*0.002+di*2)+1)/2));
        c.beginPath(); c.moveTo(dx2-R*0.022,my+mh*0.70); c.lineTo(dx2+R*0.022,my+mh*0.70);
        c.lineTo(dx2,my+mh*0.70+len); c.closePath(); c.fill();
      }
    }
  }
}

/* ---------- the timeline ----------
   hush, lightning, hit, back off, lightning, hit ... then the big one */
function startScare(){
  var st=scareStyle();
  SCARE.on=true; SCARE.t=0; SCARE.style=st; SCARE.hit=0;
  SCARE.cracks=[]; SCARE.bits=[]; SCARE.flash=0; SCARE.dark=0;
  SCARE.glitch=0; SCARE.shake=0; SCARE.alpha=1; SCARE.scale=1;
  SCARE.ox=0; SCARE.oy=0; SCARE.skip=false; SCARE.beats=[]; SCARE.fired={};
  var t=0.75, i;                                  /* the quiet bit first */
  for(i=0;i<st.hits;i++){
    var last=(i===st.hits-1);
    SCARE.beats.push({t:t,      what:'bolt'});
    SCARE.beats.push({t:t+0.22, what:'come', i:i});
    SCARE.beats.push({t:t+(last?0.95:0.62), what:'hit', i:i, big:last});
    t += last ? 1.5 : 1.05;
  }
  SCARE.dur=t+0.35;
  $('#scareCv').className='on';
  scareCanvas();
  thunder();
  if(MUSIC.on&&MUSIC.bus){                        /* the music gets out of the way */
    var c=actx();
    MUSIC.bus.gain.cancelScheduledValues(c.currentTime);
    MUSIC.bus.gain.setValueAtTime(Math.max(0.0001,MUSIC.bus.gain.value),c.currentTime);
    MUSIC.bus.gain.exponentialRampToValueAtTime(0.06,c.currentTime+0.4);
  }
}
function endScare(){
  SCARE.on=false;
  $('#scareCv').className='';
  if(MUSIC.on&&MUSIC.bus){
    var c=actx();
    MUSIC.bus.gain.cancelScheduledValues(c.currentTime);
    MUSIC.bus.gain.setValueAtTime(Math.max(0.0001,MUSIC.bus.gain.value),c.currentTime);
    MUSIC.bus.gain.exponentialRampToValueAtTime(0.55,c.currentTime+0.8);
  }
  lungeDone();
}
function skipScare(){
  if(!SCARE.on) return false;
  SCARE.skip=true; SCARE.t=SCARE.dur; endScare(); return true;
}
function scareTick(dt){
  if(!SCARE.on) return;
  var st=SCARE.style, i, b;
  SCARE.t+=dt;
  for(i=0;i<SCARE.beats.length;i++){
    b=SCARE.beats[i];
    if(SCARE.t>=b.t && !SCARE.fired[i]){
      SCARE.fired[i]=true;
      if(b.what==='bolt'){
        SCARE.flash=1; SCARE.flashCol=st.flash;
        SCARE.bolt=makeBolt(); SCARE.boltT=0.22;
        if(SCARE.t>0.8) thunder();
      }else if(b.what==='come'){
        SCARE.hit=b.i;
      }else if(b.what==='hit'){
        var w=SW||window.innerWidth, h=SH||window.innerHeight;
        var hx=w*(0.32+Math.random()*0.36), hy=h*(0.30+Math.random()*0.34);
        crackBurst(hx,hy,b.big?9:4,Math.min(w,h)*(b.big?0.42:0.26));
        addScareBits(hx,hy,st.bits,b.big?26:14);
        SCARE.shake=b.big?1:0.7;
        SCARE.flash=b.big?0.9:0.55; SCARE.flashCol=st.flash;
        if(st.mode==='glitch') SCARE.glitch=b.big?1:0.6;
        smash(st.bits);
        if(b.big){
          /* the smash lands first, then it lets him have it */
          setTimeout(function(){ screamFor(S.face); },130);
        }else{
          growl();
        }
      }
    }
  }
  SCARE.flash=Math.max(0,SCARE.flash-dt*3.2);
  SCARE.boltT=Math.max(0,SCARE.boltT-dt);
  SCARE.shake=Math.max(0,SCARE.shake-dt*3.4);
  SCARE.glitch=Math.max(0,SCARE.glitch-dt*2.2);
  SCARE.dark=Math.min(1,SCARE.dark+dt*1.5);

  /* where the face is, and how big, for this moment */
  var prog=0, from=[0,0], idx=Math.min(SCARE.hit,st.from.length-1);
  for(i=0;i<SCARE.beats.length;i++){
    b=SCARE.beats[i];
    if(b.what==='come'&&SCARE.t>=b.t){
      var nextHit=null, j;
      for(j=i;j<SCARE.beats.length;j++) if(SCARE.beats[j].what==='hit'){ nextHit=SCARE.beats[j]; break; }
      if(nextHit&&SCARE.t<=nextHit.t+0.35){
        prog=Math.max(0,Math.min(1,(SCARE.t-b.t)/(nextHit.t-b.t)));
        idx=b.i; from=st.from[Math.min(b.i,st.from.length-1)];
      }
    }
  }
  var big=(idx===st.hits-1);
  var curve=prog*prog;
  if(st.mode==='walk')   curve=prog*0.9;
  if(st.mode==='charge') curve=Math.pow(prog,3);
  if(st.mode==='blink')  curve=Math.floor(prog*4)/4;
  if(st.mode==='rise')   curve=Math.pow(prog,1.6);
  SCARE.scale=1+(big?9:4.2)*curve;
  SCARE.ox=from[0]*(1-curve)*(SW*0.55);
  SCARE.oy=from[1]*(1-curve)*(SH*0.55);
  SCARE.alpha = (st.mode==='fade') ? (0.25+0.75*curve)
              : (st.mode==='blink'&&prog>0&&prog<1&&(Math.floor(prog*8)%2===1)) ? 0.15 : 1;

  for(i=SCARE.bits.length-1;i>=0;i--){
    var p=SCARE.bits[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=(p.k==='wisp'?-0.06:0.22);
    p.life-=dt*(p.k==='wisp'?0.7:1.1);
    if(p.life<=0) SCARE.bits.splice(i,1);
  }
  if(SCARE.t>=SCARE.dur) endScare();
}
function makeBolt(){
  var w=SW||window.innerWidth, h=SH||window.innerHeight;
  var x=w*(0.2+Math.random()*0.6), y=-10, pts=[[x,y]], i;
  for(i=0;i<9;i++){
    x+=(Math.random()-0.5)*w*0.18;
    y+=h/9*(0.7+Math.random()*0.6);
    pts.push([x,y]);
  }
  return pts;
}
function drawScare(t){
  if(!SCARE.on) return;
  var c=scareCanvas(), st=SCARE.style, i, j;
  var w=SW, h=SH;
  c.clearRect(0,0,w,h);

  /* the dark */
  c.fillStyle='rgba(2,1,6,'+(0.55+0.4*SCARE.dark).toFixed(3)+')';
  c.fillRect(0,0,w,h);

  /* the shake */
  var sh=SCARE.shake;
  c.save();
  if(sh>0) c.translate((Math.random()-0.5)*26*sh,(Math.random()-0.5)*26*sh);

  /* the face, coming at him */
  var face=faceById(S.face);
  var R=Math.min(w,h)*0.22*SCARE.scale*(face.size||1);
  c.globalAlpha=SCARE.alpha;
  paintFace(c,w/2+SCARE.ox,h/2+SCARE.oy,R,face,LAST_STAGE,t,{x:0,y:0.1});
  c.globalAlpha=1;
  c.restore();

  /* dark round the edges, over the top of it, so the screen still feels dim
     even when the face is filling the whole thing */
  var vg=c.createRadialGradient(w/2,h/2,Math.min(w,h)*0.18,w/2,h/2,Math.max(w,h)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,'+(0.55+0.35*SCARE.dark).toFixed(3)+')');
  c.fillStyle=vg; c.fillRect(0,0,w,h);

  /* the picture tearing, for the one that breaks */
  if(SCARE.glitch>0.02){
    var dpr=Math.min(2,window.devicePixelRatio||1), bands=5;
    for(i=0;i<bands;i++){
      var by=Math.random()*h, bh=6+Math.random()*26;
      var dx=(Math.random()-0.5)*70*SCARE.glitch;
      c.drawImage(scv, 0,Math.floor(by*dpr), Math.floor(w*dpr),Math.floor(bh*dpr),
                       dx,by, w,bh);
    }
    c.fillStyle='rgba(127,227,255,'+(0.10*SCARE.glitch).toFixed(3)+')';
    c.fillRect(0,0,w,h);
  }

  /* the lightning */
  if(SCARE.boltT>0&&SCARE.bolt){
    c.strokeStyle=st.bolt; c.lineCap='round'; c.lineJoin='round';
    c.globalAlpha=Math.min(1,SCARE.boltT/0.22);
    c.lineWidth=7; c.globalAlpha*=0.35;
    c.beginPath(); c.moveTo(SCARE.bolt[0][0],SCARE.bolt[0][1]);
    for(i=1;i<SCARE.bolt.length;i++) c.lineTo(SCARE.bolt[i][0],SCARE.bolt[i][1]);
    c.stroke();
    c.globalAlpha=Math.min(1,SCARE.boltT/0.22); c.lineWidth=2.5; c.strokeStyle='#fff';
    c.stroke();
    c.globalAlpha=1;
  }

  /* the broken glass */
  if(SCARE.cracks.length){
    for(j=0;j<2;j++){
      c.strokeStyle=(j===0)?'rgba(0,0,0,.62)':'rgba(255,255,255,.92)';
      c.lineWidth=(j===0)?6:2.4;
      c.lineCap='round'; c.lineJoin='round';
      for(i=0;i<SCARE.cracks.length;i++){
        var p=SCARE.cracks[i];
        c.beginPath(); c.moveTo(p[0][0],p[0][1]);
        var k; for(k=1;k<p.length;k++) c.lineTo(p[k][0],p[k][1]);
        c.stroke();
      }
    }
  }

  /* whatever it threw off */
  for(i=0;i<SCARE.bits.length;i++){
    var b2=SCARE.bits[i];
    c.globalAlpha=Math.max(0,Math.min(1,b2.life));
    if(b2.k==='ember')      c.fillStyle='#ff7a2b';
    else if(b2.k==='slime') c.fillStyle='#9bff5a';
    else if(b2.k==='drip')  c.fillStyle='#4fc3f7';
    else if(b2.k==='wisp')  c.fillStyle='#cfd6ff';
    else if(b2.k==='static')c.fillStyle=(i%2)?'#7fe3ff':'#ffffff';
    else if(b2.k==='leg')   c.fillStyle='#8a6ad0';
    else                    c.fillStyle='#ffd93d';
    if(b2.k==='none'){ }
    else if(b2.k==='static'){ c.fillRect(b2.x,b2.y,b2.r*3,b2.r*0.8); }
    else { c.beginPath(); c.arc(b2.x,b2.y,b2.r,0,6.283); c.fill(); }
  }
  c.globalAlpha=1;

  /* the flash */
  if(SCARE.flash>0.01){
    c.fillStyle=st.flash;
    c.globalAlpha=Math.min(0.92,SCARE.flash);
    c.fillRect(0,0,w,h);
    c.globalAlpha=1;
  }

  /* it goes black for a moment before it starts laughing */
  var left=SCARE.dur-SCARE.t;
  if(left<0.3){
    c.fillStyle='rgba(0,0,0,'+Math.min(1,(0.3-left)/0.3).toFixed(3)+')';
    c.fillRect(0,0,w,h);
  }

  /* a way out for anyone who has seen it enough */
  if(SCARE.t>1.2){
    c.fillStyle='rgba(255,255,255,.45)';
    c.font='bold 11px "Courier New",monospace'; c.textAlign='center';
    c.fillText('TAP TO SKIP', w/2, h-16);
  }
}

function drawFace(t){
  var st=S.stage, face=faceById(S.face);
  var base=Math.min(W,H);
  var grow=[0.30,0.33,0.36,0.39,0.42,0.45,0.49][st];
  var R=base*grow*(1-squash*0.10)*(face.size||1);
  var cx=W/2, cy=H/2+Math.sin(t*0.0011)*(base*0.012);
  var sx=1+squash*0.14, sy=1-squash*0.14;

  if(st>=4){
    var g=ctx.createRadialGradient(cx,cy,R*0.4,cx,cy,R*2.1);
    g.addColorStop(0,'rgba(120,255,90,'+(0.04+0.025*st)+')');
    g.addColorStop(1,'rgba(120,255,90,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
  if(st>=6){
    var v=ctx.createRadialGradient(cx,cy,R*0.8,cx,cy,Math.max(W,H)*0.78);
    v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.72)');
    ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  }
  var track=null;
  if(st>=6&&pointer.has){
    var dx=pointer.x-cx, dy=pointer.y-cy, dd=Math.sqrt(dx*dx+dy*dy)||1;
    track={x:dx/dd,y:dy/dd};
  }
  ctx.save(); ctx.translate(cx,cy); ctx.scale(sx,sy); ctx.translate(-cx,-cy);
  paintFace(ctx,cx,cy,R,face,st,t,track);
  ctx.restore();
  return {cx:cx,cy:cy,R:R};
}

var last=0;
function frame(ts){
  if(!last) last=ts;
  var dt=Math.min(0.1,(ts-last)/1000); last=ts;
  fpsWatch(ts);

  /* idle earnings */
  /* nothing ticks up on its own any more: the number only moves when he taps */

  scareTick(dt);
  squash=Math.max(0,squash-dt*5.5);
  wobble=Math.max(0,wobble-dt*3.0);

  sizeCanvas();              /* the box changes as the shop and the bars fill in */
  ctx.clearRect(0,0,W,H);
  var sp=drawFace(ts);

  /* bursts */
  var i;
  for(i=bits.length-1;i>=0;i--){
    var b=bits[i];
    b.x+=b.vx; b.y+=b.vy; b.vy+=0.16; b.life-=dt*1.7;
    if(b.life<=0){ bits.splice(i,1); continue; }
    ctx.globalAlpha=Math.max(0,b.life);
    ctx.fillStyle=b.col;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;

  /* floating +N */
  ctx.textAlign='center';
  for(i=floats.length-1;i>=0;i--){
    var f=floats[i];
    f.y-=dt*54; f.life-=dt*1.05;
    if(f.life<=0){ floats.splice(i,1); continue; }
    ctx.globalAlpha=Math.max(0,f.life);
    ctx.fillStyle='#3dff77';
    ctx.font='bold '+Math.max(14,Math.floor(Math.min(W,H)*0.055))+'px "Courier New",monospace';
    ctx.fillText(f.t,f.x,f.y);
  }
  ctx.globalAlpha=1;

  paintNumbers();
  drawScare(ts);
  window.requestAnimationFrame(frame);
}

/* ---------- tapping ---------- */
function tapAt(x,y){
  var gain=perTap();
  S.total+=gain; S.grand+=gain;
  squash=1; wobble=1;
  var col=['#ffd93d','#ffd93d','#ffe066','#bcd05a','#8fbb46','#7bd14a','#3dff77'][S.stage];
  addBurst(x,y,col,6+S.stage*2);
  addFloat(x,y-10,'+'+fmt(gain));
  blip(420+S.stage*70+Math.random()*40,0.055,'square',0.045);

function checkStage(){
  var ns=stageFor(S.total);

/* pointer + keyboard + gamepad, because handhelds send all sorts of things */
function evPos(e){
  var r=cv.getBoundingClientRect();
  var cxp=(e.clientX!==undefined)?e.clientX:(r.left+r.width/2);
  var cyp=(e.clientY!==undefined)?e.clientY:(r.top+r.height/2);
  return {x:cxp-r.left,y:cyp-r.top};
}
function onDown(e){
  if(e&&e.preventDefault) e.preventDefault();
  var p=evPos(e||{});
  pointer.x=p.x; pointer.y=p.y; pointer.has=true;
  tapAt(p.x,p.y);
  var tm=$('#tapme'); if(tm) tm.style.display='none';
}
cv.addEventListener('pointerdown',onDown);
cv.addEventListener('pointermove',function(e){
  var p=evPos(e); pointer.x=p.x; pointer.y=p.y; pointer.has=true;
});
cv.addEventListener('pointerleave',function(){ pointer.has=false; });
/* older browsers with no pointer events */
if(!window.PointerEvent){
  cv.addEventListener('touchstart',function(e){
    if(e.preventDefault)e.preventDefault();
    var t=e.touches&&e.touches[0]; if(t)onDown(t); else onDown({});
  });
  cv.addEventListener('mousedown',onDown);
}
var TAPKEYS={Space:1,Enter:1,NumpadEnter:1,ArrowUp:1,KeyZ:1,KeyX:1,KeyA:1,KeyB:1,
             KeyS:1,ShiftLeft:1,ControlLeft:1,Numpad0:1,Numpad5:1,Numpad8:1};
document.addEventListener('keydown',function(e){
  if(TAPKEYS[e.code]){
    if(e.preventDefault)e.preventDefault();
    var r=cv.getBoundingClientRect();
    onDown({clientX:r.left+r.width/2,clientY:r.top+r.height/2});
  }
});
var padWas=false;
setInterval(function(){
  var gp=null;
  try{ gp=navigator.getGamepads?navigator.getGamepads():null; }catch(e){ return; }
  if(!gp) return;
  var on=false,i,j;
  for(i=0;i<gp.length;i++){
    var g=gp[i]; if(!g||!g.buttons) continue;
    for(j=0;j<g.buttons.length;j++){
      var b=g.buttons[j];
      if(b&&(b.pressed||b.value>0.5)){ on=true; break; }
    }
    if(on) break;
  }
  if(on&&!padWas){
    var r=cv.getBoundingClientRect();
    onDown({clientX:r.left+r.width/2,clientY:r.top+r.height/2});
  }
  padWas=on;
},60);

function askTrust(){
  if(S.stage<FACES_LAST) return;
  var f0=faceById(S.face);
  $('#tsQ').textContent = f0.lesson ? 'DO YOU KNOW ME?' : 'DO YOU TRUST ME?';
  $('#tsSub').textContent = f0.lesson
    ? 'It says it knows your Mama. It says it is here to pick you up. It is being very nice about it.'
    : 'It has stopped chewing. It is waiting for you to answer.';
  $('#tsYes').textContent = f0.lesson ? 'YES, GO WITH IT' : 'TRUST IT';
  $('#tsNo').textContent  = f0.lesson ? 'NO, WALK AWAY'   : 'DO NOT TRUST IT';

function lungeDone(){
  var f=faceById(S.face);
  if(trustAnswer===true){
    var bonus=f.lesson?Math.max(60,Math.floor(perTap()*12))
                     :Math.max(200,Math.floor(perTap()*40));
    S.total+=bonus; S.grand+=bonus; S.trust=(S.trust||0)+1; save();
    $('#rTitle').textContent='HA. GOT YOU.';
    $('#rSub').textContent = f.lesson
      ? 'It got you, and it is laughing. You did not know that one. That is the whole point of a '+
        'stranger — you never know. So the answer with a stranger is always NO, even a nice one. '+
        'Have '+fmt(bonus)+' points and do not fall for it again.'
      : 'You trusted it. Nobody should trust a face with that many teeth. It is laughing at you. '+
        'Have '+fmt(bonus)+' points for being brave about it.';
  }else{
    var b2=f.lesson?Math.max(400,Math.floor(perTap()*60))
                  :Math.max(80,Math.floor(perTap()*15));
    S.total+=b2; S.grand+=b2; S.trust=(S.trust||0)+1; save();
    $('#rTitle').textContent = f.lesson ? 'GOOD. THAT IS THE RIGHT ANSWER.' : 'FINE. BE LIKE THAT.';
    $('#rSub').textContent = f.lesson
      ? 'You did not know it, so you said no. That is exactly right, every single time, and it is '+
        'worth more than falling for it. '+fmt(b2)+' points.'
      : 'It backed off. It says nobody ever trusts it and it is getting used to that. '+
        fmt(b2)+' points for being careful.';
  }
  $('#reveal').className='on';
  var box=$('#app'); box.className='shake';
  setTimeout(function(){ box.className=''; },520);
}

/* ---------- the face picker ---------- */
function drawPreview(cnv,face,st,locked){
  var d2=cnv.getContext('2d');
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w2=cnv.clientWidth||110, h2=Math.round(w2*0.92);
  cnv.width=Math.round(w2*dpr); cnv.height=Math.round(h2*dpr);
  cnv.style.height=h2+'px';
  d2.setTransform(dpr,0,0,dpr,0,0);
  d2.clearRect(0,0,w2,h2);
  paintFace(d2,w2/2,h2/2,Math.min(w2,h2)*0.40,face,st,0,null);
  if(locked){
    /* the veil is drawn here, with the same width the face was drawn at.
       Measuring the canvas again outside this function gave 0 while the
       picker was still hidden, so the veil never covered anything. */
    d2.fillStyle='rgba(8,5,16,.86)';
    d2.fillRect(0,0,w2,h2);
    d2.fillStyle='#ffd93d'; d2.textAlign='center'; d2.textBaseline='middle';
    d2.font='bold '+Math.round(h2*0.34)+'px "Courier New",monospace';
    d2.fillText('?',w2/2,h2/2);
  }
}
function wearFace(id){
  if(id===S.face) return;
  S.prog[S.face]=S.total;          /* park the face you are leaving */
  S.face=id;
  S.total=(S.prog[id]||0);         /* pick up where that one was left */
  S.stage=stageFor(S.total);
  lastStage=-1; lastLevel=-1;
  save();
}
function buildPicker(){
  var h='',i;
  $('#pkHead').innerHTML='PICK A FACE &nbsp;·&nbsp; '+facesDoneCount()+'/'+FACES.length+' DONE';
  var LIST=allFaces();
  for(i=0;i<LIST.length;i++){
    var f=LIST[i], un=faceUnlocked(f), dn=faceDone(f.id);
    var stg=stageFor(faceTotal(f.id));
    var note = dn ? 'FINISHED &#10003;'
                  : (stg>0 ? ('STAGE '+(stg+1)+' OF '+STAGES.length) : 'NOT STARTED');
    if(f.mine) note = (S.face==='mine') ? 'TAP TO CHANGE IT' : note;
    h+='<button class="pk'+(S.face===f.id?' sel':'')+(un?'':' lock')+(dn?' done':'')+'" type="button" data-f="'+f.id+'">'+
       '<canvas id="pv_'+f.id+'"></canvas>'+
       '<div class="nm">'+(un?f.n:'? ? ?')+'</div>'+
       '<div class="lk">'+(un?note:needText(f))+'</div>'+
       '<div class="becomes">'+(un?('becomes '+f.beco):'locked')+'</div>'+
       '</button>';
  }
  $('#pkGrid').innerHTML=h;
  for(i=0;i<LIST.length;i++){
    var f2=LIST[i], un2=faceUnlocked(f2);
    drawPreview($('#pv_'+f2.id),f2,un2?stageFor(faceTotal(f2.id)):0,!un2);
  }
  var btns=$('#pkGrid').querySelectorAll('[data-f]');
  for(i=0;i<btns.length;i++){
    (function(b){
      b.addEventListener('click',function(e){
        if(e&&e.preventDefault)e.preventDefault();
        var id=b.getAttribute('data-f'), f3=faceById(id);
        if(!faceUnlocked(f3)){
          blip(160,0.2,'sawtooth',0.05);
          toast(needText(f3)+' FIRST. TAKE IT ALL THE WAY TO THE END.',2600);
          return;
        }
        if(id==='mine'&&S.face==='mine'){ openMaker(); return; }
        wearFace(id); blip(1000,0.09,'square',0.06);
        buildPicker();
        toast(id==='mine' ? 'TAP IT AGAIN TO CHANGE HOW IT LOOKS'
                          : (faceDone(id) ? (f3.n+' — ALREADY FINISHED')
                                          : (f3.n+' IT IS')));
      });
    })(btns[i]);
  }
}

var MK={cx:0,cy:0,R:0,drag:null,hot:null};

/* where the head sits inside the editor box */
function mkGeom(){
  var cnv=$('#mkCv');
  var w=cnv.clientWidth||300, h=cnv.clientHeight||230;
  var c=customCfg();
  return {w:w,h:h,cx:w/2,cy:h*0.47,R:Math.min(w,h)*0.30*(c.size||1)};
}
function drawMaker(){
  var cnv=$('#mkCv'); if(!cnv) return;
  var c=cnv.getContext('2d');
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var g=mkGeom();
  cnv.width=Math.round(g.w*dpr); cnv.height=Math.round(g.h*dpr);
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,g.w,g.h);
  MK.cx=g.cx; MK.cy=g.cy; MK.R=g.R;

  paintFace(c,g.cx,g.cy,g.R,myFace(),0,0,null);

  /* the two handles he pulls to make the head bigger or smaller */
  var hy=g.cy, i, xs=[g.cx-g.R-2,g.cx+g.R+2];
  for(i=0;i<2;i++){
    c.fillStyle=(MK.hot==='size')?'#3dff77':'#ffd93d';
    c.strokeStyle='rgba(0,0,0,.5)'; c.lineWidth=2;
    c.beginPath(); c.arc(xs[i],hy,9,0,6.283); c.fill(); c.stroke();
    c.strokeStyle='#2a1a00'; c.lineWidth=2; c.lineCap='round';
    c.beginPath(); c.moveTo(xs[i]-4,hy); c.lineTo(xs[i]+4,hy); c.stroke();
    c.beginPath(); c.moveTo(xs[i],hy-4); c.lineTo(xs[i],hy+4); c.stroke();
  }
  drawBin(c, !!(MK.drag&&MK.drag.type==='move'&&MK.drag.onBin));

  /* the small one in the corner: what this face turns into at the end */
  var pv=$('#mkPvB');
  if(pv){
    var c2=pv.getContext('2d');
    var w2=pv.clientWidth||70, h2=pv.clientHeight||60;
    pv.width=Math.round(w2*dpr); pv.height=Math.round(h2*dpr);
    c2.setTransform(dpr,0,0,dpr,0,0); c2.clearRect(0,0,w2,h2);
    paintFace(c2,w2/2,h2/2,Math.min(w2,h2)*0.38,myFace(),LAST_STAGE,0,null);
  }

  /* a ring round whatever he is holding */
  if(MK.drag&&MK.drag.type==='move'){
    var t=MK.drag;
    c.strokeStyle='#3dff77'; c.lineWidth=2;
    c.beginPath(); c.arc(g.cx+t.px*g.R,g.cy+t.py*g.R,(t.pr||0.3)*g.R+6,0,6.283); c.stroke();
  }
}

/* one little picture of a part, for the tray buttons and the drag ghost */
function paintPart(c,cx,cy,r,kind,isMouth){
  var f=myFace();
  if(isMouth){
    c.fillStyle='#2a0a0a';
    c.beginPath();
    c.moveTo(cx-r,cy-r*0.22);
    c.quadraticCurveTo(cx,cy+r*0.95,cx+r,cy-r*0.22);
    c.quadraticCurveTo(cx,cy-r*0.55,cx-r,cy-r*0.22);
    c.closePath(); c.fill();
    var n=5,i; c.fillStyle='#fff';
    for(i=0;i<n;i++){
      var ff=(i+0.5)/n, tx=cx-r+2*r*ff, edge=Math.sin(Math.PI*ff);
      var tw=(2*r/n)*(kind==='needle'?0.26:(kind==='block'?0.38:0.46));
      var th=r*0.34*edge+2;
      if(kind==='needle') th*=1.45;
      if(kind==='block') c.fillRect(tx-tw,cy-r*0.22,tw*2,th);
      else{ c.beginPath(); c.moveTo(tx-tw,cy-r*0.22); c.lineTo(tx+tw,cy-r*0.22);
            c.lineTo(tx,cy-r*0.22+th); c.closePath(); c.fill(); }
    }
    return;
  }
  if(kind==='hollow'){
    c.fillStyle='#2a2e4a'; c.beginPath(); c.ellipse(cx,cy,r*0.92,r,0,0,6.283); c.fill(); return;
  }
  if(kind==='square'){
    c.fillStyle='#eef6ff'; c.fillRect(cx-r,cy-r*0.8,r*2,r*1.6);
    c.fillStyle='#16202b'; c.fillRect(cx-r*0.34,cy-r*0.4,r*0.68,r*0.8); return;
  }
  if(kind==='almond'){
    c.fillStyle='#12100f'; c.save(); c.translate(cx,cy); c.rotate(0.42);
    c.beginPath(); c.ellipse(0,0,r*1.35,r*0.72,0,0,6.283); c.fill();
    c.fillStyle='#9bff5a'; c.beginPath(); c.ellipse(0,0,r*0.32,r*0.24,0,0,6.283); c.fill();
    c.restore(); return;
  }
  if(kind==='many'){
    var k; for(k=0;k<3;k++){
      c.fillStyle='#fff'; c.beginPath(); c.arc(cx+(k-1)*r*0.8,cy,r*0.42,0,6.283); c.fill();
      c.fillStyle=f.ink; c.beginPath(); c.arc(cx+(k-1)*r*0.8,cy,r*0.19,0,6.283); c.fill();
    }
    return;
  }
  c.fillStyle='#fff'; c.beginPath(); c.arc(cx,cy,r,0,6.283); c.fill();
  c.strokeStyle='rgba(0,0,0,.3)'; c.lineWidth=1.5; c.stroke();
  c.fillStyle=f.ink; c.beginPath(); c.arc(cx,cy,r*0.5,0,6.283); c.fill();
}

/* a drop only counts if it lands on the actual head shape — an alien head is
   nothing like a circle, and parts were ending up hanging off the side */
/* the bin lives in the bottom right corner of the editor box */
function binRect(){
  var g=mkGeom(), sz=Math.max(44,Math.min(58,g.h*0.22));
  return {x:g.w-sz-8, y:g.h-sz-8, w:sz, h:sz};
}
function overBin(x,y){
  var b=binRect();
  return x>=b.x-8 && x<=b.x+b.w+8 && y>=b.y-8 && y<=b.y+b.h+8;
}
function drawBin(c,hot){
  var b=binRect(), x=b.x, y=b.y, w=b.w, h=b.h;
  c.save();
  c.fillStyle=hot?'rgba(255,90,110,.28)':'rgba(255,255,255,.06)';
  c.strokeStyle=hot?'#ff5a6e':'rgba(201,163,255,.45)';
  c.lineWidth=2;
  var rr=10;
  c.beginPath();
  c.moveTo(x+rr,y); c.lineTo(x+w-rr,y); c.quadraticCurveTo(x+w,y,x+w,y+rr);
  c.lineTo(x+w,y+h-rr); c.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
  c.lineTo(x+rr,y+h); c.quadraticCurveTo(x,y+h,x,y+h-rr);
  c.lineTo(x,y+rr); c.quadraticCurveTo(x,y,x+rr,y); c.closePath();
  c.fill(); c.stroke();

  /* the can itself */
  var cx=x+w/2, top=y+h*0.34, bw=w*0.40, bh=h*0.42;
  c.strokeStyle=hot?'#ff5a6e':'#c9a3ff'; c.lineWidth=2.4; c.lineCap='round';
  /* lid, tilted open when something is about to go in */
  c.save();
  c.translate(cx,top-h*0.04);
  if(hot) c.rotate(-0.38);
  c.beginPath(); c.moveTo(-bw*0.72,0); c.lineTo(bw*0.72,0); c.stroke();
  c.beginPath(); c.moveTo(-bw*0.24,-h*0.07); c.lineTo(bw*0.24,-h*0.07); c.stroke();
  c.beginPath(); c.moveTo(-bw*0.24,-h*0.07); c.lineTo(-bw*0.24,0); c.stroke();
  c.beginPath(); c.moveTo(bw*0.24,-h*0.07); c.lineTo(bw*0.24,0); c.stroke();
  c.restore();
  /* body */
  c.beginPath();
  c.moveTo(cx-bw*0.58,top+h*0.03);
  c.lineTo(cx-bw*0.44,top+bh);
  c.lineTo(cx+bw*0.44,top+bh);
  c.lineTo(cx+bw*0.58,top+h*0.03);
  c.stroke();
  var i2;
  for(i2=-1;i2<=1;i2++){
    c.beginPath();
    c.moveTo(cx+i2*bw*0.28,top+h*0.10);
    c.lineTo(cx+i2*bw*0.24,top+bh*0.84);
    c.stroke();
  }
  c.restore();
}
function insideHead(px,py){
  var cnv=$('#mkCv'); if(!cnv) return Math.sqrt(px*px+py*py)<=1.0;
  var c=cnv.getContext('2d'), g=mkGeom();
  c.save(); c.setTransform(1,0,0,1,0,0);
  var dpr=Math.min(2,window.devicePixelRatio||1);
  headPath(c,g.cx*dpr,g.cy*dpr,g.R*0.94*dpr,customCfg().shape,0);
  var hit=c.isPointInPath((g.cx+px*g.R)*dpr,(g.cy+py*g.R)*dpr);
  c.restore();
  return hit;
}
function hitPart(mx,my){
  var g=mkGeom(), c=customCfg(), i;
  for(i=c.eyes.length-1;i>=0;i--){
    var e=c.eyes[i];
    var dx=mx-(g.cx+e.x*g.R), dy=my-(g.cy+e.y*g.R);
    if(Math.sqrt(dx*dx+dy*dy)<=Math.max(16,e.r*g.R+6)) return {what:'eye',i:i};
  }
  if(c.mouth){
    var mdx=mx-(g.cx+c.mouth.x*g.R), mdy=my-(g.cy+c.mouth.y*g.R);
    if(Math.abs(mdx)<=g.R*0.34*c.mouth.w+10 && Math.abs(mdy)<=g.R*0.22+10) return {what:'mouth'};
  }
  return null;
}
function nearHandle(mx,my){
  var g=mkGeom();
  if(Math.abs(my-g.cy)>22) return false;
  return Math.abs(Math.abs(mx-g.cx)-g.R)<=20;
}
function mkPoint(ev){
  var cnv=$('#mkCv'), r=cnv.getBoundingClientRect();
  var t=(ev.touches&&ev.touches[0])?ev.touches[0]:ev;
  return {x:t.clientX-r.left, y:t.clientY-r.top, cx:t.clientX, cy:t.clientY};
}
function showGhost(kind,isMouth,x,y){
  var gh=$('#mkGhost'), c=gh.getContext('2d');
  c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,52,52);
  paintPart(c,26,26,isMouth?20:13,kind,isMouth);
  gh.style.left=x+'px'; gh.style.top=y+'px'; gh.className='on';
}
function hideGhost(){ $('#mkGhost').className=''; }

function mkMove(ev){
  if(!MK.drag) return;
  if(ev&&ev.preventDefault) ev.preventDefault();
  var p=mkPoint(ev), d=MK.drag, g=mkGeom(), c=customCfg();
  if(d.type==='new'){ d.onBin=overBin(p.x,p.y); showGhost(d.kind,d.isMouth,p.cx,p.cy); return; }
  if(d.type==='size'){
    var want=Math.abs(p.x-g.cx)/(Math.min(g.w,g.h)*0.30);
    c.size=Math.max(0.55,Math.min(1.45,want));
    drawMaker(); return;
  }
  if(d.type==='move'){
    d.px=(p.x-g.cx)/g.R; d.py=(p.y-g.cy)/g.R;
    d.onBin=overBin(p.x,p.y);
    if(d.what==='eye'){ c.eyes[d.i].x=d.px; c.eyes[d.i].y=d.py; d.pr=c.eyes[d.i].r; }
    else { c.mouth.x=d.px; c.mouth.y=d.py; d.pr=0.34; }
    drawMaker();
  }
}
function mkUp(ev){
  var d=MK.drag; if(!d) return;
  var p=mkPoint(ev), g=mkGeom(), c=customCfg();
  MK.drag=null; MK.hot=null; hideGhost();
  var px=(p.x-g.cx)/g.R, py=(p.y-g.cy)/g.R;
  var onCanvas=(p.x>=0&&p.y>=0&&p.x<=g.w&&p.y<=g.h);

  if(d.type==='new'){
    if(onCanvas&&overBin(p.x,p.y)){
      blip(240,0.10,'sawtooth',0.04);
    }else if(onCanvas&&insideHead(px,py)){
      if(d.isMouth){
        c.mouth={x:px,y:py,w:c.mouth?c.mouth.w:1,k:d.kind};
        blip(700,0.08,'square',0.05); toast('MOUTH ON',1200);
      }else if(c.eyes.length>=MAX_EYES){
        blip(160,0.2,'sawtooth',0.05); toast('THAT IS ENOUGH EYES ('+MAX_EYES+')',1800);
      }else{
        c.eyes.push({x:px,y:py,r:0.19,k:d.kind});
        blip(900,0.07,'square',0.05); toast('EYE ON',1000);
      }
      save();
    }else{
      blip(200,0.12,'sawtooth',0.04);
      toast('DROP IT ON THE HEAD',1400);
    }
  }else if(d.type==='move'){
    if(overBin(p.x,p.y)){
      if(d.what==='eye'){ c.eyes.splice(d.i,1); toast('EYE IN THE BIN',1300); }
      else { c.mouth=null; toast('MOUTH IN THE BIN',1300); }
      blip(300,0.10,'square',0.05);
      setTimeout(function(){ blip(180,0.18,'sawtooth',0.05); },90);
    }else if(!insideHead(px,py)){
      /* nothing is thrown away by accident: it goes back where it was */
      if(d.what==='eye'){ c.eyes[d.i].x=d.ox; c.eyes[d.i].y=d.oy; }
      else { c.mouth.x=d.ox; c.mouth.y=d.oy; }
      blip(240,0.10,'sawtooth',0.04);
      toast('THAT IS OFF THE HEAD &mdash; USE THE BIN TO GET RID OF IT',2400);
    }
    save();
  }else if(d.type==='size'){ save(); }
  drawMaker(); buildMaker(true);
}
function mkDown(ev){
  if(ev&&ev.preventDefault) ev.preventDefault();
  var p=mkPoint(ev);
  if(nearHandle(p.x,p.y)){ MK.drag={type:'size'}; MK.hot='size'; drawMaker(); return; }
  var h=hitPart(p.x,p.y);
  if(h){
    var g=mkGeom(), c=customCfg();
    var src=(h.what==='eye')?c.eyes[h.i]:c.mouth;
    MK.drag={type:'move',what:h.what,i:h.i,
             px:(p.x-g.cx)/g.R,py:(p.y-g.cy)/g.R,
             ox:src.x, oy:src.y,          /* where it was, to put it back */
             onBin:false,
             pr:h.what==='eye'?c.eyes[h.i].r:0.34};
    blip(600,0.05,'square',0.04);
    drawMaker();
  }
}
function bindMaker(){
  var cnv=$('#mkCv');
  cnv.addEventListener('pointerdown',mkDown,false);
  cnv.addEventListener('touchstart',function(e){ if(!window.PointerEvent) mkDown(e); },false);
  document.addEventListener('pointermove',mkMove,false);
  document.addEventListener('pointerup',mkUp,false);
  document.addEventListener('touchmove',function(e){ if(!window.PointerEvent) mkMove(e); },false);
  document.addEventListener('touchend',function(e){ if(!window.PointerEvent) mkUp(e); },false);
}

/* what opens up next, so there is always something to aim at */
function nextTierText(){
  var i,g=S.grand||0;
  for(i=0;i<TIERS.length;i++){
    if(g<TIERS[i]){
      var locked=0,k,a,j;
      for(k in PARTS){ a=PARTS[k]; for(j=0;j<a.length;j++){ if(a[j].t===i) locked++; } }
      return fmt(TIERS[i]-g)+' more points opens '+locked+' new part'+(locked===1?'':'s');
    }
  }
  return 'You have opened every part there is.';
}
function buildMaker(keepScroll){
  var cfg=customCfg(), h='', r, i;
  for(r=0;r<PART_ORDER.length;r++){
    var key=PART_ORDER[r].k, list=PARTS[key];
    var drg=(key==='eye'||key==='teeth');
    h+='<div class="mkRow"><h4>'+PART_ORDER[r].n+'</h4>'+
       '<div class="mkOpts'+(drg?' five':'')+'">';
    for(i=0;i<list.length;i++){
      var o=list[i], open=tierOpen(o.t);
      var sel=(key==='shape'&&cfg.shape===o.id)||(key==='col'&&cfg.col===o.id);
      var art=(key==='eye'||key==='teeth')?('<canvas id="pt_'+key+'_'+o.id+'"></canvas>'):'';
      var sw='';
      if(key==='col'){
        var P=mkPal(o.p[0],o.p[1],o.p[2],o.p[3]);
        sw='<span class="sw" style="background:linear-gradient(90deg,'+P.col[0]+','+P.col[3]+','+P.col[6]+')"></span>';
      }
      h+='<button class="opt'+(drg?' drag':'')+(sel&&open?' sel':'')+(open?'':' lock')+'" type="button" '+
         'data-k="'+key+'" data-o="'+o.id+'">'+sw+art+(open?o.n:'? ? ?')+
         (open?'':'<span class="need">AT '+fmt(TIERS[o.t])+'</span>')+'</button>';
    }
    h+='</div></div>';
  }
  $('#mkRows').innerHTML=h;
  $('#mkNext').textContent=nextTierText();

  /* little pictures on the eye and mouth buttons */
  for(r=0;r<PART_ORDER.length;r++){
    var k2=PART_ORDER[r].k;
    if(k2!=='eye'&&k2!=='teeth') continue;
    var l2=PARTS[k2];
    for(i=0;i<l2.length;i++){
      var cv=$('#pt_'+k2+'_'+l2[i].id); if(!cv) continue;
      var dpr=Math.min(2,window.devicePixelRatio||1);
      var w2=cv.clientWidth||60, h2=30;
      cv.width=Math.round(w2*dpr); cv.height=Math.round(h2*dpr);
      var c2=cv.getContext('2d'); c2.setTransform(dpr,0,0,dpr,0,0);
      if(tierOpen(l2[i].t)) paintPart(c2,w2/2,h2/2,k2==='teeth'?13:9,l2[i].id,k2==='teeth');
      else{ c2.fillStyle='#ffd93d'; c2.textAlign='center'; c2.font='bold 15px "Courier New",monospace';
            c2.fillText('?',w2/2,h2/2+5); }
    }
  }

  var bs=$('#mkRows').querySelectorAll('[data-o]');
  for(i=0;i<bs.length;i++){
    (function(b){
      var k=b.getAttribute('data-k'), id=b.getAttribute('data-o');
      var o=partById(k,id);
      if(k==='eye'||k==='teeth'){
        /* these are dragged onto the head rather than chosen */
        b.addEventListener('pointerdown',function(e){
          if(e&&e.preventDefault)e.preventDefault();
          if(!tierOpen(o.t)){ blip(160,0.2,'sawtooth',0.05);
            toast('GET TO '+fmt(TIERS[o.t])+' POINTS TO OPEN THIS ONE',2400); return; }
          MK.drag={type:'new',kind:id,isMouth:(k==='teeth')};
          showGhost(id,k==='teeth',e.clientX,e.clientY);
          blip(560,0.05,'square',0.04);
        },false);
        return;
      }
      b.addEventListener('click',function(e){
        if(e&&e.preventDefault)e.preventDefault();
        if(!tierOpen(o.t)){
          blip(160,0.2,'sawtooth',0.05);
          toast('GET TO '+fmt(TIERS[o.t])+' POINTS TO OPEN THIS ONE',2400);
          return;
        }
        customCfg()[k]=id; save();
        blip(820+Math.random()*200,0.07,'square',0.05);
        buildMaker(); drawMaker();
      },false);
    })(bs[i]);
  }
  if(!keepScroll) drawMaker();
}
