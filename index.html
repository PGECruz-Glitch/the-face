/* =======================================================================
   THE OPENING PAGE — tap DADDY 10 times and SEBASTIAN 20 times to get in
   ======================================================================= */
var NEED_D=10, NEED_S=20;
var gateD=0, gateS=0, gateOpen=false;

function makeBlobs(){
  var cols=['#ffd93d','#3ce0ff','#3dff77','#ff6ec7','#ffb03d','#c9a3ff','#7bff9e','#ff5a6e'];
  var box=$('#blobs'), h='', i;
  for(i=0;i<16;i++){
    var sz=Math.round(16+Math.random()*46);
    /* keep them out to the sides and away from the top and bottom edges of the
       screen, so nothing floats across the words or the two faces */
    var lx=(i%2===0) ? (1+Math.random()*13) : (84+Math.random()*13);
    h+='<div class="blob" style="width:'+sz+'px;height:'+sz+'px;'+
       'left:'+lx.toFixed(1)+'%;top:'+Math.round(2+Math.random()*90)+'%;'+
       'background:'+cols[i%cols.length]+';'+
       'animation:bob '+(4.5+Math.random()*4).toFixed(1)+'s ease-in-out infinite;'+
       'animation-delay:-'+(Math.random()*5).toFixed(1)+'s"></div>';
  }
  box.innerHTML=h;
}
/* the picture reacts: every press pushes it further away from the ordinary
   snapshot it starts as, and when both are done it has gone full GAME MASTER. */
function paintPicture(){
  var pd=Math.min(1,gateD/NEED_D), ps=Math.min(1,gateS/NEED_S);
  var p=(gateD+gateS)/(NEED_D+NEED_S);
  var img=$('#iPic');
  var f='hue-rotate('+Math.round(p*210)+'deg) saturate('+(1+p*1.7).toFixed(2)+') '+
        'contrast('+(1+p*0.55).toFixed(2)+') brightness('+(1-p*0.10).toFixed(2)+')';
  img.style.webkitFilter=f; img.style.filter=f;
  $('#gD').style.opacity=pd*0.95;
  $('#gD').style.background='radial-gradient(circle,rgba(255,217,61,'+(0.30*pd).toFixed(2)+') 40%,'+
    'rgba(255,217,61,0) 72%)';
  $('#gD').style.boxShadow='0 0 '+Math.round(26*pd)+'px '+Math.round(5*pd)+'px rgba(255,217,61,.75)';
  $('#gS').style.opacity=ps*0.95;
  $('#gS').style.background='radial-gradient(circle,rgba(60,224,255,'+(0.30*ps).toFixed(2)+') 40%,'+
    'rgba(60,224,255,0) 72%)';
  $('#gS').style.boxShadow='0 0 '+Math.round(26*ps)+'px '+Math.round(5*ps)+'px rgba(60,224,255,.75)';
  $('#iTint').style.opacity=(p*0.55).toFixed(2);
  $('#iStamp').style.opacity=(gateOpen?1:0);
}
function paintGate(){
  $('#cD').textContent=gateD+' / '+NEED_D;
  $('#cS').textContent=gateS+' / '+NEED_S;
  $('#bD').style.width=Math.min(100,gateD/NEED_D*100)+'%';
  $('#bS').style.width=Math.min(100,gateS/NEED_S*100)+'%';
  $('#whoD').className='who'+(gateD>=NEED_D?' full':'');
  $('#whoS').className='who'+(gateS>=NEED_S?' full':'');
  if(gateD>=NEED_D&&gateS>=NEED_S&&!gateOpen){
    gateOpen=true;
    $('#iGo').className='on';
    $('#iAsk').innerHTML='BOTH DONE. NOW PRESS <b>START</b>.';
    blip(700,0.1,'square',0.06);
    setTimeout(function(){ blip(900,0.1,'square',0.06); },110);
    setTimeout(function(){ blip(1250,0.16,'square',0.06); },230);
    growl();
  }
  paintPicture();
}
function gateTap(which){
  var el;
  if(which==='d'){
    if(gateD>=NEED_D) return;
    gateD++; el=$('#whoD'); blip(360+gateD*42,0.06,'square',0.05);
  }else{
    if(gateS>=NEED_S) return;
    gateS++; el=$('#whoS'); blip(520+gateS*30,0.06,'square',0.05);
  }
  /* restart the little pop on the button and on the picture */
  wantMusic(true);              /* his first press is the gesture the browser wants */
  el.className=el.className.replace(' hit','');
  var pic=$('#iPicWrap'); pic.className='';
  if(el.offsetWidth>=0) el.className=el.className+' hit';
  if(pic.offsetWidth>=0) pic.className='pop';
  setTimeout(function(){ el.className=el.className.replace(' hit',''); },220);
  setTimeout(function(){ pic.className=''; },240);
  paintGate();
}
function bindGate(id,which){
  var el=$(id), lastTouch=0;
  el.addEventListener('touchstart',function(e){
    if(e&&e.preventDefault)e.preventDefault();
    lastTouch=Date.now(); gateTap(which);
  },false);
  el.addEventListener('click',function(e){
    if(e&&e.preventDefault)e.preventDefault();
    if(Date.now()-lastTouch<700) return;   /* the click the browser sends after a tap */
    gateTap(which);
  },false);
}
var started=false;
function startGame(){
  if(started) return; started=true;
  if(S.full&&fsCan()) fsGo();          /* his press is what lets us do this */
  wantMusic(true);
  $('#intro').className='';
  $('#blobs').innerHTML='';        /* stop the animations once we are past it */
  sizeCanvas();
  setInterval(function(){ S.prog[S.face]=S.total; save(); },1000);
  window.requestAnimationFrame(frame);
  blip(900,0.1,'square',0.06);
  setTimeout(function(){ toast('TAP THE FACE. KEEP TAPPING.',2200); },400);
}
$('#iGo').addEventListener('click',function(e){
  if(e&&e.preventDefault)e.preventDefault();
  if(gateOpen) startGame();
});
trackEl();          /* find out about boss.mp3 now, not when he presses START */
if(fsCan()) $('#iFull').className='on';
fsPaint();
makeBlobs();
bindGate('#whoD','d');
bindGate('#whoS','s');
paintGate();

sizeCanvas();
applySound();
S.stage=stageFor(S.total);
if(S.stage>=LAST_STAGE&&!faceDone(S.face)) S.done[S.face]=true;
if(S.stage>=FACES_LAST) $('#askagain').className='on';

/* let the tests reach in */
window.__paint=paintFace;
window.__eyesets=EYESETS;
window.__game={S:S,FACES:FACES,askTrust:askTrust,answerTrust:answerTrust,LUNGE:LUNGE,
  SCARE:SCARE,SCARES:SCARES,SCREAMS:SCREAMS,scream:scream,screamFor:screamFor,chuckle:chuckle,scareStyle:scareStyle,startScare:startScare,skipScare:skipScare,scareTick:scareTick,faceById:faceById,faceUnlocked:faceUnlocked,buildPicker:buildPicker,perTap:perTap,stageFor:stageFor,
  STAGES:STAGES,LEVELS:LEVELS,levelFor:levelFor,tapsToNextLevel:tapsToNextLevel,tapsToNextStage:tapsToNextStage,
  fsCan:fsCan,fsEl:fsEl,fsToggle:fsToggle,fsPaint:fsPaint,fsGo:fsGo,fsOut:fsOut,
  MUSIC:MUSIC,TRACK:TRACK,FPS:FPS,leadVoices:leadVoices,musicStart:musicStart,musicStop:musicStop,musicLevel:musicLevel,wantMusic:wantMusic,
  LEAD:LEAD,ROOTS:ROOTS,STEPS:STEPS,BPM:BPM,BARS:BARS,
  isKick:isKick,isClap:isClap,isBass:isBass,isStab:isStab,isRoll:isRoll,
  PARTS:PARTS,TIERS:TIERS,tierOpen:tierOpen,myFace:myFace,allFaces:allFaces,mkPal:mkPal,
  openMaker:openMaker,buildMaker:buildMaker,customCfg:customCfg,drawMaker:drawMaker,
  freshCustom:freshCustom,mkGeom:mkGeom,MK:MK,MAX_EYES:MAX_EYES,hitPart:hitPart,nearHandle:nearHandle,
  binRect:binRect,overBin:overBin,
  checkLevel:function(){ checkLevel(); },tapAt:tapAt,fmt:fmt,
  faceDone:faceDone,faceIndex:faceIndex,faceTotal:faceTotal,needText:needText,wearFace:wearFace,
  checkStage:checkStage,facesDoneCount:facesDoneCount,OPEN_AT_START:OPEN_AT_START,LAST_STAGE:LAST_STAGE,
  startGame:startGame,gateState:function(){ return {d:gateD,s:gateS,open:gateOpen}; },
  set:function(o){ for(var k in o) S[k]=o[k]; S.stage=stageFor(S.total); lastLevel=levelFor(S.total); }};
})();
</script>
